  if (col === 'inventory_status_id') return STATUSES[v] && STATUSES[v].code;
  if (col === 'lot_id' || col === 'parent_lot_id' || col === 'child_lot_id') return lotOf(v) && lotOf(v).lot_no;
  if (col === 'lpn_id') return lpnOf(v) && lpnOf(v).lpn_no;
  if (col === 'supplier_id') return PARTNERS[v];
  if (col === 'transform_spec_id' || col === 'spec_id') { const x = S.specs.find(y => y.transform_spec_id === v); return x && x.spec_code; }
  if (col === 'spec_input_id') { const x = S.specInputs.find(y => y.transform_input_id === v); return x && ITEMS[x.item_id].code; }
  if (col === 'spec_output_id') { const x = S.specOutputs.find(y => y.transform_output_id === v); return x && ITEMS[x.item_id].code; }
  if (col === 'transform_execution_id' || col === 'reference_id') { const e = S.execs.find(x => x.transform_execution_id === v); return e && e.transform_no; }
  return '';
}
function hl(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/(--[^\n]*)/g, '<span class="cm">$1</span>')
    .replace(/\b(BEGIN|COMMIT|INSERT INTO|VALUES|UPDATE|SET|WHERE|AND|RETURNING|ON CONFLICT|ON CONSTRAINT|DO UPDATE|NULL)\b/g, '<span class="kw">$1</span>');
}
function renderDb() {
  if (!devMode) return;
  const last = S.txlog[0];
  const total = Object.values(CH).reduce((t, m) => t + Object.keys(m).length, 0);
  $('#dbLast').innerHTML = last ? `마지막 트랜잭션 · ${last.title} · ${last.ts} · <b style="color:#fbbf24">${total}행 변경</b>` : '아직 실행한 트랜잭션이 없습니다 — 분할을 실행하면 어떤 테이블에 행이 쌓이는지 보여 줍니다';
  $('#dbCaret').textContent = dbOpen ? '▼ 접기' : '▲ 펼치기';
  if (!dbOpen) { $('#dbTabs').innerHTML = $('#dbTools').innerHTML = $('#dbBody').innerHTML = ''; return; }
  const tabs = [['tx', '트랜잭션 로그', S.txlog.length ? S.txlog[0].stmts.length : 0], ...Object.keys(TABLES).map(t => [t, t, CH[t] ? Object.keys(CH[t]).length : 0])];
  $('#dbTabs').innerHTML = tabs.map(([id, label, n]) => `<button class="db-tab ${dbTab === id ? 'on' : ''}" onclick="dbTab='${id}';renderDb()">${label}${n && id !== 'tx' ? `<span class="cnt">${n}</span>` : ''}</button>`).join('');
  if (dbTab === 'tx') {
    $('#dbTools').innerHTML = `<span>BEGIN … COMMIT 단위로 실행 순서대로 표시합니다. 최신이 위.</span>`;
    $('#dbBody').innerHTML = S.txlog.length ? `<div class="txlog">${S.txlog.map((t, i) => `<div class="tx"><div class="tx-head"><span class="ok">COMMIT</span><b>${t.title}</b><span style="color:#94a3b8">${t.ts} · ${t.stmts.length}문</span>${i === 0 ? '<span class="op upd">LATEST</span>' : ''}</div>
      <pre>${hl('BEGIN;')}\n${t.stmts.map(s => (s.note ? hl(`-- ▶ ${s.note}`) + '\n' : '') + hl(s.text)).join('\n')}\n${hl('COMMIT;')}</pre></div>`).join('')}</div>`
      : `<div class="empty" style="color:#94a3b8">LOT 분할을 실행하면 이 트랜잭션에서 실행되는 SQL이 순서대로 쌓입니다.</div>`;
    return;
  }
  const def = TABLES[dbTab], ch = CH[dbTab] || {}, chc = CHCOL[dbTab] || {};
  let rows = def.rows();
  if (dbOnlyChanged) rows = rows.filter(r => ch[r[def.pk]]);
  rows = [...rows].sort((a, b) => (ch[b[def.pk]] ? 1 : 0) - (ch[a[def.pk]] ? 1 : 0));
  $('#dbTools').innerHTML = `<label><input type="checkbox" ${dbOnlyChanged ? 'checked' : ''} onchange="dbOnlyChanged=this.checked;renderDb()"> 마지막 트랜잭션에서 바뀐 행만</label>
    <span class="legend"><span><i style="background:#22c55e66"></i>INSERT</span><span><i style="background:#f59e0b66"></i>UPDATE (바뀐 칸 노란색)</span></span><span>${def.rows().length}행</span>`;
  $('#dbBody').innerHTML = `<table><thead><tr><th>op</th>${def.cols.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.map(r => {
    const op = ch[r[def.pk]], cs = chc[r[def.pk]];
    return `<tr class="${op === 'INSERT' ? 'ins' : op === 'UPDATE' ? 'upd' : ''}"><td>${op ? `<span class="op ${op === 'INSERT' ? 'ins' : 'upd'}">${op}</span>` : ''}</td>${def.cols.map(c => {
      const v = r[c];
      if (v == null) return `<td class="null">NULL</td>`;
      const lb = fkLabel(c, v);
      return `<td class="${op === 'UPDATE' && cs && cs.has(c) ? 'chg' : ''}">${v}${lb && lb !== v ? `<span class="fk">(${lb})</span>` : ''}</td>`;
    }).join('')}</tr>`;
  }).join('') || `<tr><td colspan="${def.cols.length + 1}" style="color:#64748b">바뀐 행이 없습니다</td></tr>`}</tbody></table>`;
}

/* ------------------------------------------------------------------ */
function render() {
  renderNav();
  const titles = { split: ['재고변환', '재고 분할'], merge: ['재고변환', '재고 통합'], history: ['재고변환', '변환 이력'], stock: ['재고관리', '재고 현황'], numrule: ['시스템 설정', '채번 규칙'], transform: ['재고변환', '품목 변환'], spec: ['기준정보', '품목 변환 기준'], trace: ['재고관리', 'LOT 추적 (계보)'] };
  $('#crumb').innerHTML = `WMS / ${titles[page][0]} / <b>${titles[page][1]}</b>`;
  $('#screen').innerHTML = page === 'split' ? renderSplit() : page === 'merge' ? renderMerge() : page === 'history' ? renderHistory() : page === 'numrule' ? renderNumRules() : page === 'transform' ? renderTransform() : page === 'spec' ? renderSpecs() : page === 'trace' ? renderTrace() : renderStock();
  if (page === 'split' && SP.stockId && !SP.done) refreshSummary();
  if (page === 'merge' && !MG.done && MG.step === 2 && MG.picked.length >= 2) refreshMergeSummary();
  if (page === 'transform' && TX.specId && !TX.done) refreshTx();
  renderDb();
}
render();
</script>
