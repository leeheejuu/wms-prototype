<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LX WMS · LOT 분할</title>
<style>
:root{--bg:#f5f7fb;--panel:#fff;--line:#e6e9ef;--line2:#edf0f4;--text:#172033;--muted:#687386;--nav:#101827;--nav2:#182235;--brand:#4f46e5;--brand-soft:#eef2ff;--ok:#0f9f6e;--ok-soft:#e9f9f2;--warn:#d97706;--warn-soft:#fff5e6;--bad:#dc2626;--bad-soft:#feecec;--shadow:0 8px 28px rgba(23,32,51,.08);--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;font-family:Pretendard,"Noto Sans KR",Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
button{font:inherit}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
/* sidebar */
.side{background:var(--nav);color:#c8d0df;padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;font-size:18px;padding:5px 10px 24px}
.mark{width:31px;height:31px;border-radius:9px;background:linear-gradient(135deg,#7c3aed,#2563eb);display:grid;place-items:center;font-size:13px}
.tenant{margin:0 6px 18px;padding:11px;border:1px solid #2c394f;border-radius:10px;background:#141f31;font-size:13px}
.tenant small{display:block;color:#7f8ca2;margin-bottom:3px;font-size:11px}
.nav-title{font-size:11px;color:#6f7d93;padding:14px 12px 6px;letter-spacing:.06em}
.nav{display:flex;gap:10px;align-items:center;padding:10px 12px;margin:2px 0;border-radius:9px;cursor:pointer;font-size:13.5px}
.nav:hover,.nav.active{background:var(--nav2);color:#fff}
.nav.active{box-shadow:inset 3px 0 var(--brand)}
.nav .ico{width:18px;text-align:center;opacity:.85}
.nav .badge{margin-left:auto;font-size:10px;padding:2px 6px;border-radius:99px;background:#26324a;color:#9aa6bd}
.nav.off{color:#6f7d93}
.nav.off:hover{color:#9aa6bd}
/* main */
.main{min-width:0;padding-bottom:64px}
.top{height:60px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}
.crumb{font-weight:700;color:var(--muted)}.crumb b{color:var(--text)}
.top-right{display:flex;gap:10px;align-items:center}
.pill{border:1px solid var(--line);padding:6px 10px;border-radius:999px;color:var(--muted);background:#fff;font-size:12px}
.avatar{width:32px;height:32px;border-radius:50%;background:#e0e7ff;color:#4338ca;display:grid;place-items:center;font-weight:800;font-size:12px}
.content{padding:24px 28px 40px;max-width:1360px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.pagehead h1{font-size:24px;margin:0 0 6px}
.pagehead p{margin:0;color:var(--muted)}
/* common */
.btn{border:1px solid var(--line);background:#fff;padding:9px 13px;border-radius:8px;cursor:pointer;font-weight:650;color:var(--text)}
.btn:hover{background:#f8fafc}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 5px 14px rgba(79,70,229,.25)}
.btn.primary:hover{background:#4338ca}
.btn.danger{color:var(--bad);border-color:#f5c2c2}
.btn.danger:hover{background:var(--bad-soft)}
.btn.sm{padding:6px 10px;font-size:12px}
.btn.lg{padding:12px 20px;font-size:15px}
.btn:disabled{opacity:.42;cursor:not-allowed;box-shadow:none}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel-head h2{font-size:15px;margin:0;display:flex;align-items:center;gap:8px}
.panel-body{padding:16px}
input,select{border:1px solid #d9dee8;border-radius:8px;padding:8px 10px;background:#fff;color:var(--text);font:inherit}
input:focus,select:focus{outline:2px solid #c7d2fe;border-color:#818cf8}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;white-space:nowrap}
th{font-size:12px;color:#647084;background:#fafbfc;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:600}
td{padding:11px 12px;border-bottom:1px solid var(--line2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:700;background:var(--brand-soft);color:#4338ca}
.tag.green{background:var(--ok-soft);color:#087857}
.tag.orange{background:var(--warn-soft);color:#b45309}
.tag.red{background:var(--bad-soft);color:#b91c1c}
.tag.gray{background:#f1f3f6;color:#667085}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted)}
.small{font-size:12px}
.empty{padding:36px;text-align:center;color:var(--muted)}
/* stepper */
.stepper{display:flex;gap:0;margin-bottom:18px;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.step{flex:1;display:flex;align-items:center;gap:10px;padding:13px 16px;color:var(--muted);position:relative}
.step+.step{border-left:1px solid var(--line)}
.step .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;background:#eef0f4;color:#7a8597;flex:none}
.step.on{color:var(--text);background:#fafaff}
.step.on .n{background:var(--brand);color:#fff}
.step.done .n{background:var(--ok);color:#fff}
.step b{display:block;font-size:13.5px}
.step span{font-size:12px}
/* stock picker */
.scanbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.scanbar input{flex:1;min-width:220px;padding:11px 12px;font-size:15px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px dashed #c7cfdd;border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer;background:#fff;color:#475467}
.chip:hover{border-color:var(--brand);color:var(--brand)}
tr.pick{cursor:pointer}
tr.pick:hover td{background:#fafbff}
tr.sel td{background:#f3f4ff!important}
tr.blocked td{color:#a2abba}
.availbar{display:inline-block;width:80px;height:6px;border-radius:99px;background:#e9edf3;overflow:hidden;vertical-align:middle;margin-left:6px}
.availbar i{display:block;height:100%;background:var(--ok)}
/* input card */
.grid2{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:16px;align-items:start}
.srccard .hero{padding:16px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#fafaff,#fff)}
.srccard .hero .code{font-size:12px;color:var(--muted)}
.srccard .hero .name{font-size:17px;font-weight:800;margin:3px 0 10px}
.kv{display:grid;grid-template-columns:96px 1fr;gap:7px 10px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600}
.qtybox{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.qtybox div{background:#f8fafc;border-radius:9px;padding:10px}
.qtybox small{display:block;color:var(--muted);font-size:11px}
.qtybox b{font-size:18px}
.qtybox .av b{color:var(--ok)}
.qtybox .al b{color:var(--warn)}
.inputqty{padding:14px 16px}
.inputqty label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}
.inputqty .row{display:flex;gap:8px;align-items:center}
.inputqty input{width:140px;font-size:18px;font-weight:700;text-align:right}
.lineage{font-family:var(--mono);font-size:12px;background:#f6f7fb;border-radius:7px;padding:6px 8px;display:inline-block}
/* lines */
.lines{display:flex;flex-direction:column;gap:10px}
.line{border:1px solid var(--line);border-radius:11px;padding:12px;display:grid;grid-template-columns:30px 1.25fr 1.1fr 130px 34px;gap:12px;align-items:start;background:#fff;position:relative}
.line .no{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px;margin-top:20px}
.line label.cap{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;font-weight:600}
.seg{display:inline-flex;border:1px solid #d9dee8;border-radius:8px;overflow:hidden;width:100%}
.seg button{flex:1;border:0;background:#fff;padding:7px 6px;font-size:12px;cursor:pointer;color:#475467;white-space:nowrap}
.seg button+button{border-left:1px solid #d9dee8}
.seg button.on{background:var(--brand);color:#fff;font-weight:700}
.seg button:disabled{color:#c0c6d2;cursor:not-allowed;background:#fafbfc}
.preview{margin-top:7px;font-family:var(--mono);font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.preview .tag{font-family:inherit}
.line select{width:100%;margin-top:7px}
.line input.qty{width:100%;font-size:16px;font-weight:700;text-align:right;margin-top:0}
.line .del{border:0;background:none;color:#98a2b3;cursor:pointer;font-size:18px;margin-top:18px}
.line .del:hover{color:var(--bad)}
.line .del:disabled{visibility:hidden}
.lines-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
/* distribution */
.dist{margin-top:16px;border:1px solid var(--line);border-radius:11px;padding:14px}
.dist-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;flex-wrap:wrap;gap:8px}
.dist-top b{font-size:15px}
.bar{display:flex;height:30px;border-radius:8px;overflow:hidden;background:#f1f3f6}
.bar div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;overflow:hidden;white-space:nowrap;transition:width .2s}
.bar .gap{background:repeating-linear-gradient(45deg,#fde2e2,#fde2e2 6px,#fff 6px,#fff 12px);color:var(--bad)}
.bar .over{background:var(--bad)}
.errs{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.err{display:flex;gap:8px;align-items:flex-start;color:#b91c1c;background:var(--bad-soft);border-radius:8px;padding:8px 11px;font-size:13px}
.okmsg{display:flex;gap:8px;align-items:center;color:#087857;background:var(--ok-soft);border-radius:8px;padding:8px 11px;font-size:13px}
.footer-act{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:10px;flex-wrap:wrap}
/* rules box */
.rules{font-size:12.5px;color:#475467;line-height:1.7;margin:0;padding-left:18px}
/* result */
.result-hero{display:flex;align-items:center;gap:14px;padding:18px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#ecfdf5,#fff)}
.result-hero .big{width:44px;height:44px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:22px;flex:none}
.labels{display:flex;gap:14px;flex-wrap:wrap}
.label{width:300px;border:1.5px solid #1f2937;border-radius:6px;padding:12px 14px;background:#fff;font-family:Arial,sans-serif;color:#000;position:relative}
.label .lt{font-size:10px;letter-spacing:.12em;font-weight:700;border-bottom:1px solid #000;padding-bottom:4px;margin-bottom:6px;display:flex;justify-content:space-between}
.label .lno{font-size:22px;font-weight:900;font-family:var(--mono);letter-spacing:.02em}
.label .lrow{display:flex;justify-content:space-between;font-size:11px;margin-top:3px}
.label svg{display:block;margin-top:8px;width:100%;height:42px}
.label .stamp{position:absolute;right:10px;top:30px;border:1.5px solid #b91c1c;color:#b91c1c;font-size:10px;font-weight:800;padding:1px 5px;border-radius:4px;transform:rotate(-6deg)}
/* modal */
.overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.38);z-index:40;align-items:center;justify-content:center;padding:20px}
.overlay.on{display:flex}
.modal{background:#fff;border-radius:14px;width:min(820px,100%);max-height:90vh;overflow:auto;box-shadow:0 30px 80px rgba(15,23,42,.3)}
.modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;position:sticky;top:0;background:#fff}
.modal-head h3{margin:0 0 4px;font-size:17px}
.modal-body{padding:18px 20px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:#fff}
.delta-up{color:var(--ok);font-weight:700}
.delta-dn{color:var(--bad);font-weight:700}
.arrow{color:#98a2b3;padding:0 4px}
.note{background:#f8fafc;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:12.5px;color:#475467;line-height:1.6}
/* history */
.detail-row td{background:#fbfcfe;padding:0}
.detail-box{padding:12px 16px 16px 40px}
.why{font-size:12px;color:#b45309;white-space:normal;max-width:320px;line-height:1.5}
/* db viewer */
.db{position:fixed;left:248px;right:0;bottom:0;z-index:30;background:#0f172a;color:#e2e8f0;border-top:1px solid #1e293b;box-shadow:0 -10px 30px rgba(15,23,42,.18);transition:height .25s;height:48px;display:flex;flex-direction:column}
.db.open{height:min(52vh,560px)}
.db-bar{height:48px;flex:none;display:flex;align-items:center;gap:12px;padding:0 18px;cursor:pointer;user-select:none}
.db-bar .t{font-family:var(--mono);font-weight:800;letter-spacing:.06em;font-size:12.5px}
.db-bar .last{font-size:12px;color:#94a3b8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.db-bar .caret{margin-left:auto;font-size:12px;color:#94a3b8;flex:none}
.db-bar .live{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.2);flex:none}
.db-tabs{display:flex;gap:4px;padding:0 14px 8px;flex-wrap:wrap;flex:none}
.db-tab{border:1px solid #334155;background:#111c33;color:#cbd5e1;border-radius:7px;padding:5px 9px;font-size:11.5px;cursor:pointer;font-family:var(--mono)}
.db-tab.on{background:#e2e8f0;color:#0f172a;border-color:#e2e8f0;font-weight:700}
.db-tab .cnt{display:inline-block;margin-left:5px;padding:0 5px;border-radius:99px;background:#f59e0b;color:#111;font-weight:800;font-size:10px}
.db-tools{display:flex;gap:12px;align-items:center;padding:0 16px 8px;font-size:12px;color:#94a3b8;flex:none}
.db-tools label{display:flex;gap:5px;align-items:center;cursor:pointer}
.db-body{flex:1;overflow:auto;padding:0 14px 14px}
.db table{font-family:var(--mono);font-size:11.5px;background:#0b1222;border-radius:8px;overflow:hidden}
.db th{background:#16213a;color:#93a4c0;border-bottom:1px solid #22304d;position:sticky;top:0;font-size:11px}
.db td{border-bottom:1px solid #1a2540;padding:7px 10px;color:#cbd5e1}
.db tr.ins td{background:rgba(34,197,94,.13)}
.db tr.upd td{background:rgba(245,158,11,.13)}
.db td .fk{color:#64748b;margin-left:4px}
.db td.null{color:#475569;font-style:italic}
.db td.chg{color:#fbbf24;font-weight:700}
.op{display:inline-block;font-size:10px;font-weight:800;padding:1px 6px;border-radius:4px}
.op.ins{background:#14532d;color:#86efac}
.op.upd{background:#713f12;color:#fde68a}
.txlog{display:flex;flex-direction:column;gap:10px}
.tx{border:1px solid #22304d;border-radius:9px;background:#0b1222;overflow:hidden}
.tx-head{display:flex;gap:10px;align-items:center;padding:9px 12px;background:#111c33;font-size:12px}
.tx-head b{font-family:var(--mono)}
.tx-head .ok{color:#86efac;font-family:var(--mono);font-weight:800}
.tx pre{margin:0;padding:10px 12px;font-family:var(--mono);font-size:11.5px;line-height:1.7;white-space:pre-wrap;color:#cbd5e1}
.kw{color:#c4b5fd;font-weight:700}
.cm{color:#64748b}
.legend{display:flex;gap:10px;align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
/* toast */
.toast{position:fixed;right:24px;bottom:70px;background:#111827;color:#fff;padding:12px 15px;border-radius:9px;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);transition:.2s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:none}
@media(max-width:1180px){.grid2{grid-template-columns:1fr}.line{grid-template-columns:30px 1fr 1fr;}.line .qtycol{grid-column:2/3}.line .del{grid-column:3/4;justify-self:end}}
@media(max-width:1050px){.app{grid-template-columns:72px 1fr}.side{padding:18px 8px}.logo span,.tenant,.nav span,.nav .badge,.nav-title{display:none}.logo,.nav{justify-content:center}.db{left:72px}}
@media(max-width:700px){.app{grid-template-columns:1fr}.side{display:none}.db{left:0}.content{padding:16px}.top{padding:0 16px}.top-right .pill{display:none}.stepper{flex-direction:column}.step+.step{border-left:0;border-top:1px solid var(--line)}.line{grid-template-columns:30px 1fr}.line .qtycol,.line .del{grid-column:2/3}.qtybox{grid-template-columns:1fr 1fr 1fr}}

/* ===== v3 · 사용자 중심 UX ===== */
:root{--brand:#3182f6;--brand-soft:#eef6ff;--bg:#f7f8fa;--text:#191f28;--muted:#8b95a1;--line:#e5e8eb;--ok:#00a878;--ok-soft:#eafbf5;--bad:#e42939;--bad-soft:#fff0f1;--warn:#f59f00;--warn-soft:#fff8e8;--shadow:0 8px 24px rgba(0,0,0,.06)}
body{background:var(--bg);color:var(--text);font-size:15px}
.content{max-width:1180px;padding-top:32px}
.pagehead{align-items:center;margin-bottom:24px}.pagehead h1{font-size:28px;letter-spacing:-.04em}.pagehead p{font-size:14px;line-height:1.6}
.panel{border-color:#edf0f2;border-radius:18px;box-shadow:0 3px 14px rgba(0,0,0,.035)}
.panel-head{padding:20px 22px}.panel-head h2{font-size:18px;letter-spacing:-.02em}.panel-body{padding:22px}
.btn{border-radius:12px;padding:10px 15px}.btn.primary{background:var(--brand);border-color:var(--brand);box-shadow:none}.btn.primary:hover{background:#1b64da}.btn.lg{padding:14px 22px;font-size:16px;border-radius:14px}
.stepper{border:0;background:transparent;gap:8px;overflow:visible;margin-bottom:26px}
.step{background:#fff;border:1px solid #edf0f2!important;border-radius:14px;padding:14px 16px}.step.on{background:var(--brand-soft);border-color:#cfe4ff!important}.step .n{background:#f2f4f6}.step.on .n{background:var(--brand)}.step.done .n{background:var(--ok)}
.step span{display:block;margin-top:2px;color:var(--muted)}
.task-title{font-size:24px;font-weight:800;letter-spacing:-.04em;margin:0 0 8px}.task-desc{color:var(--muted);line-height:1.65;margin:0}
.scan-hero{padding:28px 28px 22px}.scan-hero .scanbar{margin-top:22px}.scan-hero .scanbar input{height:56px;border-radius:14px;font-size:16px;padding:0 18px;background:#f9fafb;border-color:#e5e8eb}
.scan-hero .scanbar input:focus{background:#fff;outline:3px solid #dbeafe;border-color:var(--brand)}
.stock-list{padding:0 20px 20px}.stock-card{display:grid;grid-template-columns:minmax(210px,1.3fr) 1fr 1fr auto;gap:18px;align-items:center;padding:17px 18px;border:1px solid #edf0f2;border-radius:14px;margin-top:10px;background:#fff;cursor:pointer;transition:.15s}
.stock-card:hover{border-color:#b9d7ff;box-shadow:0 6px 18px rgba(49,130,246,.08);transform:translateY(-1px)}.stock-card.blocked{cursor:not-allowed;opacity:.58;background:#fafafa;box-shadow:none;transform:none}
.stock-main b{display:block;font-size:16px;margin-bottom:4px}.stock-meta{font-size:13px;color:var(--muted);line-height:1.7}.stock-qty{text-align:right}.stock-qty strong{display:block;font-size:21px;color:var(--text)}
.selected-summary{background:#fff;border:1px solid #edf0f2;border-radius:18px;padding:22px;position:sticky;top:84px}.selected-summary .item-name{font-size:19px;font-weight:800;margin:4px 0 16px}.selected-summary .lot-big{font-family:var(--mono);font-size:17px;font-weight:800}.selected-summary .available-box{margin-top:18px;background:var(--brand-soft);border-radius:14px;padding:17px}.selected-summary .available-box span{display:block;color:#4e5968;font-size:12px;margin-bottom:4px}.selected-summary .available-box b{font-size:28px;color:#1b64da}
.grid2{grid-template-columns:310px 1fr;gap:20px}
.editor-card{background:#fff;border:1px solid #edf0f2;border-radius:18px;padding:24px}

        <div><label>일련번호 세는 단위</label><select onchange="nrSet('${code}','seq_scope',this.value)"><option value="TENANT" ${d.seq_scope === 'TENANT' ? 'selected' : ''}>전체</option><option value="ITEM" ${d.seq_scope === 'ITEM' ? 'selected' : ''} ${code.startsWith('LOT_') ? '' : 'disabled'}>품목별</option></select></div></div>`}
      <div class="pv ${p.err ? 'bad' : ''}" id="pv-${code}">${p.err ? `⚠ ${p.err}` : `<span class="small muted">다음 번호</span><br><b>${p.no}</b><div class="small muted" style="margin-top:3px">${p.note}</div>`}</div>
      <div class="small muted" style="margin-top:6px">저장되는 패턴 <span class="mono" id="pt-${code}">${d.pattern}</span></div>
      ${f ? `<button class="btn ghost sm" style="align-self:flex-start;margin-top:6px" onclick="nrToggleAdv('${code}')">${NR.adv[code] ? '← 칸 채우기로' : '고급: 패턴 직접 입력'}</button>` : ''}
      ${hist.length ? `<div class="nr-hist"><div class="small" style="font-weight:700">변경 이력</div>${hist.map(h => `<div class="small"><span class="muted">${h.changed_at.slice(0, 16)} · ${h.changed_by}</span> <span class="mono">${h.before_pattern} → ${h.after_pattern}</span>${h.change_reason ? ` · ${h.change_reason}` : ''}</div>`).join('')}</div>` : ''}
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">${dirty ? `<button class="btn sm" onclick="nrReset('${code}')">되돌리기</button>` : ''}<button class="btn primary sm" id="sv-${code}" ${!dirty || p.err ? 'disabled' : ''} onclick="nrSave('${code}')">저장</button></div>
    </div>`;
  }).join('')}</div>
  <div class="note" style="margin-top:18px">LPN은 앞으로 공급업체 팔레트의 <b>GS1 SSCC</b>(18자리 표준 번호)를 그대로 쓰는 방식도 선택지로 검토 중입니다.</div>`;
}

/* ------------------------------------------------------------------
 * LOT 분할 화면
 * ------------------------------------------------------------------ */
/* 화면: "100을 기존 LOT 70 + 새 LOT 30으로 나눈다" (전체 기준, 이전 v3 UX)
 * 처리: 조각 떼어 내기 (LXWMS_LOT설계.md 8-3) — 원 재고는 새 LOT로 간 수량만큼만 줄고(TRANSFORM_OUT),
 *       새 LOT마다 생성(TRANSFORM_IN). input_qty = 새 LOT 합계. 할당분은 기존 LOT에 남아야 한다 */
let SP = { stockId: null, keep: 0, pieces: [], mode: '', done: null, search: '', advanced: false, newLpnIds: [] };

const isIntUom = s => INT_UOMS.includes(s.uom_code);
const floorQ = (s, x) => isIntUom(s) ? Math.floor(x) : Math.floor(x * 100) / 100;
function newPiece(s, qty) { return { qty, lotMode: 'AUTO', lotId: '', lpnMode: s.lpn_id ? 'NEW' : 'NONE', lpnId: '', loc: s.location_id }; }   // loc = 새 팔레트를 둘 위치 (기본 원래 위치)

/* n개로 나누기 — 전체 수량 기준. 새 LOT n-1개는 같은 몫, 기존 LOT는 나머지(할당분 포함) */
function splitPlanN(s, n) {
  const part = floorQ(s, s.on_hand_qty / n), keep = r4(s.on_hand_qty - part * (n - 1));
  if (!(part > 0)) return { ok: false, reason: '수량이 적어서 나눌 수 없습니다' };
  if (part * (n - 1) > avail(s)) return { ok: false, reason: `출고에 사용할 ${q(s.allocated_qty)} ${s.uom_code}가 있어서 ${n === 2 ? '반으로' : n + '등분으로'} 나눌 수 없습니다. 직접 수량을 정해 주십시오.` };
  return { ok: true, part, keep };
}
function evenSplit(n) {
  const s = stkOf(SP.stockId), p = splitPlanN(s, n);
  if (!p.ok) { toast(p.reason); return; }
  SP.pieces = Array.from({ length: n - 1 }, () => newPiece(s, p.part));
  SP.keep = p.keep; SP.mode = 'q' + n;
  render();
}
function manualSplit() {
  SP.mode = 'manual'; render();
  setTimeout(() => { const el = document.querySelector('.qty-simple input'); if (el) { el.focus(); el.select && el.select(); } }, 0);
}

function pickStock(id) {
  const s = stkOf(id);
  const why = stockBlock(s);
  if (why) { toast(`선택할 수 없습니다 — ${why}`); return; }
  SP = { ...SP, stockId: id, done: null, advanced: false, newLpnIds: [] };
  const p = splitPlanN(s, 2);
  if (p.ok) { SP.pieces = [newPiece(s, p.part)]; SP.keep = p.keep; SP.mode = 'q2'; }
  else { const piece = Math.max(isIntUom(s) ? 1 : 0.01, floorQ(s, avail(s) / 2)); SP.pieces = [newPiece(s, piece)]; SP.keep = r4(s.on_hand_qty - piece); SP.mode = 'manual'; }
  render();
}
function resetSplit() { SP = { stockId: null, keep: 0, pieces: [], mode: '', done: null, search: '', advanced: false, newLpnIds: [] }; render(); }

function existingLotCandidates(s) {
  const inLot = lotOf(s.lot_id);
  return S.lots.filter(l => l.lot_id !== inLot.lot_id && sameAttrs(l, inLot));
}
function existingLpnCandidates(s) {
  return S.lpns.filter(l => l.location_id === s.location_id && l.lpn_id !== s.lpn_id && l.lpn_status !== 'CLOSED');
}

function plan() {
  const s = stkOf(SP.stockId), inLot = lotOf(s.lot_id), root = rootOf(inLot);
  let k = 0, p = 0;
  return SP.pieces.map((pc, i) => {
    let lotNo = '', lotKey, lpnNoV = 'LPN 없음', lpnKey = null;
    if (pc.lotMode === 'AUTO') { k++; lotNo = formatNo(ruleOf('LOT_SPLIT').pattern, root.last_child_seq + k, { parent: root.lot_no, itemCode: ITEMS[s.item_id].code }); lotKey = 'new' + i; }
    else if (pc.lotMode === 'KEEP') { lotNo = inLot.lot_no; lotKey = inLot.lot_id; }
    else { const l = lotOf(pc.lotId); lotNo = l ? l.lot_no : ''; lotKey = pc.lotId || '?' + i; }
    if (pc.lpnMode === 'KEEP') { lpnNoV = lpnNo(s.lpn_id); lpnKey = s.lpn_id; }
    else if (pc.lpnMode === 'NEW') { p++; lpnNoV = peekNo('LPN', {}, p); lpnKey = 'new' + i; }
    else if (pc.lpnMode === 'EXISTING') { const l = lpnOf(pc.lpnId); lpnNoV = l ? l.lpn_no : ''; lpnKey = pc.lpnId || '?' + i; }
    return { ...pc, i, lotNo, lotKey, lpnNo: lpnNoV, lpnKey, qty: Number(pc.qty) || 0, loc: pc.lpnMode === 'NEW' ? (pc.loc || s.location_id) : s.location_id };
  });
}

function validate() {
  const s = stkOf(SP.stockId), a = avail(s), P = plan(), errs = [], pieceErr = {}, total = s.on_hand_qty, u = s.uom_code;
  const keep = r4(Number(SP.keep) || 0);
  const perr = (i, m) => { (pieceErr[i] = pieceErr[i] || []).push(m); errs.push(`새 LOT ${i + 1}: ${m}`); };
  const moved = r4(P.reduce((t, p) => t + p.qty, 0)), sum = r4(keep + moved);
  if (sum < total) errs.push(`아직 ${q(r4(total - sum))} ${u}가 남아 있습니다. 수량을 조정해 주십시오.`);
  else if (sum > total) errs.push(`전체 수량보다 ${q(r4(sum - total))} ${u} 많이 입력했습니다.`);
  if (keep < 0) errs.push('기존 LOT 수량은 0보다 작을 수 없습니다.');
  else if (keep < s.allocated_qty) errs.push(`출고에 사용할 ${q(s.allocated_qty)} ${u}는 기존 LOT에 남아야 합니다. 기존 LOT를 ${q(s.allocated_qty)} ${u} 이상으로 정해 주십시오.`);
  if (isIntUom(s) && !Number.isInteger(keep)) errs.push(`${u}는 정수로만 나눌 수 있습니다.`);
  if (!P.length) errs.push('새 LOT를 하나 이상 추가해 주십시오.');
  P.forEach(p => {
    if (!(p.qty > 0)) perr(p.i, '수량을 입력해 주십시오');
    else if (isIntUom(s) && !Number.isInteger(p.qty)) perr(p.i, `${u}는 정수로만 나눌 수 있습니다`);
    if (p.lotMode === 'EXISTING' && !p.lotId) perr(p.i, '합칠 LOT를 골라 주십시오');
    if (p.lpnMode === 'EXISTING' && !p.lpnId) perr(p.i, '담을 LPN을 골라 주십시오');
    if (p.lotMode === 'KEEP' && (p.lpnMode === 'KEEP' || (p.lpnMode === 'NONE' && !s.lpn_id))) perr(p.i, 'LOT도 LPN도 그대로라 바뀌는 게 없습니다');
  });
  const seen = {};
  P.forEach(p => { const k = p.lotKey + '|' + p.lpnKey; if (seen[k] !== undefined) perr(p.i, `새 LOT ${seen[k] + 1}과 LOT · LPN이 같습니다. 하나로 합쳐 주십시오`); else seen[k] = p.i; });
  // 새 팔레트 위치 용량 — 원래 팔레트가 이 작업으로 비면 그 칸은 비는 것으로 본다
  const emptied = s.lpn_id && keep <= 0 && !P.some(p => p.lpnMode === 'KEEP') && !S.stocks.some(x => x !== s && x.lpn_id === s.lpn_id && x.on_hand_qty > 0) ? [s.lpn_id] : [];
  const byLoc = {}; P.filter(p => p.lpnMode === 'NEW').forEach(p => { (byLoc[p.loc] = byLoc[p.loc] || []).push(p.i); });
  Object.entries(byLoc).forEach(([loc, idx]) => { const e = capErr(loc, idx.length, emptied); if (e) idx.forEach(i => perr(i, e)); });
  // 같은 팔레트에 같은 품목 LOT가 섞이는지 (막지 않고 안내)
  let mixWarn = null;
  if (s.lpn_id) {
    const lots = new Set(S.stocks.filter(x => x !== s && x.lpn_id === s.lpn_id && x.item_id === s.item_id && x.on_hand_qty > 0).map(x => lotNoOf(x.lot_id)));
    if (keep > 0) lots.add(lotNoOf(s.lot_id));
    P.filter(p => p.lpnMode === 'KEEP' && p.qty > 0).forEach(p => lots.add(p.lotNo));
    if (lots.size >= 2) mixWarn = `${lpnNo(s.lpn_id)} 한 팔레트에 같은 품목 LOT ${lots.size}개가 섞입니다 (${[...lots].join(' · ')}). 박스마다 LOT 라벨을 붙여 구분하십시오.`;
  }
  // 화면 수량이 맞으면 moved ≤ 가용이 보장된다 (keep ≥ 할당). 처리 단계에서 한 번 더 조건부 UPDATE로 막는다
  return { errs, pieceErr, P, s, a, keep, sum, total, moved, remain: r4(total - moved), remainFree: r4(a - moved), mixWarn };
}

function setLine(i, field, val) {
  const pc = SP.pieces[i];
  pc[field] = val;
  if (field === 'lotMode' && val !== 'EXISTING') pc.lotId = '';
  if (field === 'lpnMode' && val !== 'EXISTING') pc.lpnId = '';
  render();
}
function setQty(i, val) { SP.pieces[i].qty = val; SP.mode = 'manual'; refreshSummary(); }
function setKeep(val) { SP.keep = val; SP.mode = 'manual'; refreshSummary(); }
function addLine() {       // 기존 LOT의 나눌 수 있는 몫 절반을 새 LOT로 — 합계는 그대로 맞는다
  const s = stkOf(SP.stockId), keep = Number(SP.keep) || 0, take = Math.max(0, floorQ(s, (keep - s.allocated_qty) / 2));
  SP.pieces.push(newPiece(s, take)); SP.keep = r4(keep - take); SP.mode = 'manual';
  render();
}
function delLine(i) { SP.keep = r4((Number(SP.keep) || 0) + (Number(SP.pieces[i].qty) || 0)); SP.pieces.splice(i, 1); SP.mode = 'manual'; render(); }

function stepper() {
  const st = SP.done ? 3 : SP.stockId ? 2 : 1;
  const steps = [
    ['재고 선택', '나눌 재고를 고릅니다'],
    ['수량 나누기', '몇 개로 나눌지 정합니다'],
    ['확인 및 완료', '결과를 확인하고 실행합니다'],
  ];
  return `<div class="stepper">${steps.map((x, i) => {
    const n = i + 1, cls = n < st || (st === 3 && n === 3) ? 'done' : n === st ? 'on' : '';
    return `<div class="step ${cls}"><div class="n">${cls === 'done' ? '✓' : n}</div><div><b>${x[0]}</b><span>${x[1]}</span></div></div>`;
  }).join('')}</div>`;
}

function renderSplit() {
  let h = `<div class="pagehead"><div><h1>재고 분할</h1><p>재고 하나를 필요한 수량으로 나눕니다. 새 LOT로 나누거나, LOT는 그대로 두고 팔레트만 나눌 수 있습니다.</p></div>
    ${SP.stockId ? `<button class="btn" onclick="resetSplit()">처음부터 다시</button>` : ''}</div>`;
  h += stepper();
  if (SP.done) return h + renderDone();
  if (!SP.stockId) return h + renderPicker();
  return h + renderEditor();
}

function renderPicker() {
  const kw = SP.search.trim().toLowerCase();
  const rows = S.stocks.filter(s => s.on_hand_qty > 0).filter(s => {
    if (!kw) return true;
    const it = ITEMS[s.item_id], lot = s.lot_id ? lotNoOf(s.lot_id) : '', lpn = s.lpn_id ? lpnOf(s.lpn_id).lpn_no : '';
    return [it.code, it.name, lot, lpn, LOCS[s.location_id]].join(' ').toLowerCase().includes(kw);
  });
  return `<div class="panel">
    <div class="scan-hero">
      <h2 class="task-title">어떤 재고를 나누시겠습니까?</h2>
      <p class="task-desc">LOT나 LPN을 스캔하면 바로 찾을 수 있습니다. 품목코드나 위치로 검색해도 됩니다.</p>
      <div class="scanbar"><input id="scan" placeholder="LOT · LPN 스캔 또는 품목코드 검색" value="${SP.search}" oninput="SP.search=this.value;renderKeepFocus()" onkeydown="if(event.key==='Enter')scanEnter()"></div>
      <div class="chips" style="margin-top:10px"><span class="small muted">예시</span>
        ${['PLT-0001','LOT-002','LOT-7781','FG-B'].map(c=>`<span class="chip" onclick="SP.search='${c}';render()">${c}</span>`).join('')}
        ${kw ? `<span class="chip" onclick="SP.search='';render()">검색 지우기</span>` : ''}
      </div>
    </div>
    <div class="stock-list">
      ${rows.map(s => {
        const it=ITEMS[s.item_id], why=stockBlock(s), a=avail(s), lot=s.lot_id?lotOf(s.lot_id):null;
        return `<div class="stock-card ${why?'blocked':''}" ${why?'':`onclick="pickStock('${s.inventory_stock_id}')"`}>
          <div class="stock-main"><b>${it.code} · ${it.name}</b><div class="stock-meta">${lot?`LOT ${lot.lot_no}`:'LOT 미관리'} · ${lpnNo(s.lpn_id)}</div></div>
          <div class="stock-meta"><b style="color:var(--text)">위치 ${LOCS[s.location_id]}</b><br>${STATUSES[s.inventory_status_id].name}${s.allocated_qty?` · ${q(s.allocated_qty)} ${s.uom_code} 출고 할당됨`:''}</div>
          <div class="stock-qty"><span class="small muted">분할 가능</span><strong>${q(a)} ${s.uom_code}</strong></div>
          <div>${why?`<span class="tag gray">${why}</span>`:`<button class="btn primary">선택</button>`}</div>
        </div>`;
      }).join('') || `<div class="empty">찾는 재고가 없습니다. LOT, LPN 또는 품목코드를 다시 확인해 주십시오.</div>`}
    </div>
  </div>`;
}

function renderKeepFocus() { const el=$('#scan'); if(!el)return; const pos=el.selectionStart; render(); const next=$('#scan'); next.focus(); next.setSelectionRange(pos,pos); }
function scanEnter() {
  const kw=SP.search.trim().toLowerCase();
  const hits=S.stocks.filter(s=>s.on_hand_qty>0&&!stockBlock(s)).filter(s=>{
    const lot=s.lot_id?lotNoOf(s.lot_id):'', lpn=s.lpn_id?lpnOf(s.lpn_id).lpn_no:'';
    return lot.toLowerCase()===kw||lpn.toLowerCase()===kw;
  });
  if(hits.length===1) pickStock(hits[0].inventory_stock_id);
  else if(hits.length>1) toast(`${hits.length}개의 재고가 있습니다. 목록에서 하나를 골라 주십시오.`);
  else toast('일치하는 재고를 찾지 못했습니다.');
}

function toggleAdvanced(){ SP.advanced=!SP.advanced; render(); }

function renderEditor() {
  const s=stkOf(SP.stockId), it=ITEMS[s.item_id], lot=lotOf(s.lot_id), u=s.uom_code;
  const lotCands=existingLotCandidates(s), lpnCands=existingLpnCandidates(s), v=validate(), P=v.P;
  const step=isIntUom(s)?1:'any';

  const src=`<div class="selected-summary">
    <div class="small muted">선택한 재고</div>
    <div class="item-name">${it.code} · ${it.name}</div>
    <div class="lot-big">${lot.lot_no}</div>
    <div class="stock-meta" style="margin-top:7px">${lpnNo(s.lpn_id)} · ${LOCS[s.location_id]} · ${STATUSES[s.inventory_status_id].name}</div>
    <div class="available-box"><span>현재 수량</span><b>${q(s.on_hand_qty)} ${u}</b></div>
    ${s.allocated_qty?`<div class="note" style="margin-top:12px;background:var(--warn-soft);border-color:#ffe0a3">출고에 사용할 <b>${q(s.allocated_qty)} ${u}</b>가 포함되어 있습니다. 이 수량은 기존 LOT에 남겨 둡니다.</div>`:''}
    <button class="btn" style="width:100%;margin-top:14px" onclick="SP.stockId=null;render()">다른 재고 선택</button>
  </div>`;

  const advanced=P.map((p,i)=>`<div class="advanced-row">

      <div><label>LOT 처리 방식</label>

        </select>
        ${p.lotMode==='EXISTING'?`<select style="margin-top:7px" onchange="setLine(${i},'lotId',this.value)"><option value="">LOT 선택</option>${lotCands.map(l=>`<option value="${l.lot_id}" ${l.lot_id===p.lotId?'selected':''}>${l.lot_no}</option>`).join('')}</select>`:''}
      </div>
      <div><label>LPN 처리 방식</label>
        <select onchange="setLine(${i},'lpnMode',this.value)">
          <option value="NEW" ${p.lpnMode==='NEW'?'selected':''}>새 LPN 만들기 (기본)</option>
          ${s.lpn_id?`<option value="KEEP" ${p.lpnMode==='KEEP'?'selected':''}>기존 LPN 유지</option>`:`<option value="NONE" ${p.lpnMode==='NONE'?'selected':''}>LPN 없음</option>`}

  const editor=`<div class="editor-card">

      </div>

      <button class="btn primary lg" id="goBtn" onclick="openConfirm()">분할 내용 확인하기 →</button></div>
  </div>`;
  return `<div class="grid2">${src}${editor}</div>`;
}

function refreshSummary() {
  const box=$('#dist'); if(!box)return;

  box.innerHTML=`<div class="status-top"><b>총 ${q(v.sum)} / ${q(v.total)} ${u}</b><span>${ok?'✓ 수량이 정확히 맞습니다':'수량 확인 필요'}</span></div>
    <div class="status-message">${ok?`${v.P.length+(v.keep>0?1:0)}개로 나눕니다. ${v.P.some(p=>p.lotMode!=='KEEP')?`새 LOT ${v.P.filter(p=>p.lotMode==='AUTO').length}개가 만들어집니다.`:'LOT는 그대로, 팔레트만 나눕니다 — 재구성(재포장 · 팔레트 변경)으로 기록됩니다.'}`:v.errs[0]}</div>

}

/* 실행 전 미리보기 — 재고 행 변화를 순서대로 계산 */
function simulate(v) {
  const s = v.s, tmp = new Map(), rows = [];
  const get = k => tmp.has(keyOf(k)) ? tmp.get(keyOf(k)) : (findStock(k) ? findStock(k).on_hand_qty : 0);
  const b0 = s.on_hand_qty; tmp.set(keyOf(s), r4(b0 - v.moved));
  rows.push({ label: '원래 재고', lot: lotNoOf(s.lot_id), lpn: lpnNo(s.lpn_id), before: b0, delta: -v.moved, isNew: false, type: 'TRANSFORM_OUT' });
  v.P.forEach(p => {
    const k = { ...s, lot_id: p.lotKey, lpn_id: p.lpnKey };
    const exists = tmp.has(keyOf(k)) || !!findStock(k);
    const b = exists ? get(k) : 0;
    tmp.set(keyOf(k), r4(b + p.qty));
    rows.push({ label: `${p.i + 1}번 조각`, lot: p.lotNo, lpn: p.lpnNo, before: b, delta: p.qty, isNew: !exists, type: 'TRANSFORM_IN' });
  });
  return rows;
}

        ${v.P.map(p=>`<div class="confirm-output-row"><span><b class="mono">${p.lotNo}</b><br><span class="small muted">${p.lotMode==='KEEP'?'원래 LOT · 팔레트 변경':p.lotMode==='AUTO'?'새 LOT':'기존 LOT에 합침'} · ${p.lpnNo}${p.lpnMode==='NEW'?' (새 LPN)':''} · ${LOCS[p.loc]}</span></span><b>${q(p.qty)} ${s.uom_code}</b></div>`).join('')}
      </div></div>

    <details class="tech"><summary>재고 변화 상세 보기</summary>
      <div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>구분</th><th>이력</th><th>LOT</th><th>LPN</th><th class="num">변경 전</th><th class="num">증감</th><th class="num">변경 후</th></tr></thead>
      <tbody>${rows.map(r=>`<tr><td>${r.label}</td><td class="mono small">${r.type}</td><td class="mono">${r.lot}</td><td class="mono">${r.lpn}</td><td class="num">${r.isNew?'새 재고':q(r.before)}</td><td class="num">${r.delta>0?'+':''}${q(r.delta)}</td><td class="num"><b>${q(r4(r.before+r.delta))}</b></td></tr>`).join('')}</tbody></table></div>

function closeModal() { $('#overlay').classList.remove('on'); }

/* ------------------------------------------------------------------
 * 재고 병합 화면
 *   · 같은 LOT: LOT 유지(KEEP). 모을 팔레트가 고른 재고 중 하나면 그 재고는 움직이지 않고(기준 재고) 나머지만 옮겨 온다
 *   · 다른 LOT: 새 LOT(M-YYMMDD-NNNN, AUTO) — 품목 lot_merge_yn = Y 일 때만. 계보는 inventory_lot_genealogy
 * ------------------------------------------------------------------ */
let MG = { picked: [], qty: {}, target: null, newLoc: '', step: 1, done: null, search: '', newLpnId: null };
const pad4 = n => String(n).padStart(4, '0');
const ymdKey = () => nowStr().slice(2, 10).replace(/-/g, '');
const minDate = arr => { const v = arr.filter(Boolean).sort(); return v.length ? v[0] : null; };

function mergeBlock(s) {
  if (MG.picked.includes(s.inventory_stock_id)) return null;
  if (!ITEMS[s.item_id].lot) return 'LOT 관리 품목이 아닙니다';
  if (avail(s) <= 0) return '전량 할당돼 있습니다 · 할당 해제 후 병합';
  if (!MG.picked.length) return null;
  const first = stkOf(MG.picked[0]);
  if (s.item_id !== first.item_id) return `품목이 다릅니다 (${ITEMS[first.item_id].code}끼리만 합칠 수 있습니다)`;
  if (s.inventory_status_id !== first.inventory_status_id) return `재고상태가 다릅니다 (${STATUSES[first.inventory_status_id].name} 재고끼리만)`;
  if (s.owner_id !== first.owner_id) return '화주가 다릅니다';
  const lots = new Set(MG.picked.map(id => stkOf(id).lot_id)); lots.add(s.lot_id);
  if (lots.size > 1 && !ITEMS[s.item_id].merge) return '이 품목은 같은 LOT끼리만 합칠 수 있습니다';
  return null;
}
function togglePick(id) {
  const i = MG.picked.indexOf(id);
  if (i >= 0) { MG.picked.splice(i, 1); delete MG.qty[id]; if (MG.target === id) MG.target = null; render(); return; }
  const why = mergeBlock(stkOf(id));
  if (why) { toast(why); return; }
  MG.picked.push(id); render();
}
function resetMerge() { MG = { picked: [], qty: {}, target: null, newLoc: '', step: 1, done: null, search: '', newLpnId: null }; render(); }
function startMergeFrom(id) { resetMerge(); page = 'merge'; togglePick(id); }

function mergeInfo() {
  const rows = MG.picked.map(stkOf), first = rows[0], it = ITEMS[first.item_id], uom = first.uom_code;
  const lotIds = [...new Set(rows.map(r => r.lot_id))], sameLot = lotIds.length === 1;
  if (MG.target !== 'NEW' && !MG.picked.includes(MG.target)) MG.target = [...rows].sort((a, b) => b.on_hand_qty - a.on_hand_qty)[0].inventory_stock_id;
  const target = MG.target, targetRow = target === 'NEW' ? null : stkOf(target);
  const loc = target === 'NEW' ? (MG.newLoc || first.location_id) : targetRow.location_id;
  const anchor = sameLot && targetRow ? targetRow : null;        // 같은 LOT · 기존 팔레트로 모으면 그 재고는 그대로
  const lines = rows.filter(r => r !== anchor).map(r => ({ s: r, qty: Number(MG.qty[r.inventory_stock_id] ?? avail(r)) || 0 }));
  const moved = r4(lines.reduce((t, l) => t + l.qty, 0));
  const total = r4(moved + (anchor ? anchor.on_hand_qty : 0));
  const usedLots = [...new Set(lines.filter(l => l.qty > 0).map(l => l.s.lot_id))].map(lotOf);
  let outLot;
  if (sameLot) outLot = { lot_no: lotOf(lotIds[0]).lot_no, isNew: false };
  else {
    
    const sups = [...new Set(usedLots.map(l => l.supplier_id))];
    outLot = { lot_no: peekNo('LOT_MERGE', { itemId: first.item_id, itemCode: it.code }), isNew: true,
      manufacture_date: minDate(usedLots.map(l => l.manufacture_date)), expiry_date: minDate(usedLots.map(l => l.expiry_date)),
      supplier_id: sups.length === 1 ? sups[0] : null, parents: usedLots };
  }
  const lpnLabelV = target === 'NEW' ? peekNo('LPN') : targetRow.lpn_id ? lpnNo(targetRow.lpn_id) : '팔레트 없음';
  return { rows, first, it, uom, sameLot, target, targetRow, loc, anchor, lines, moved, total, outLot, lpnLabel: lpnLabelV };
}
function mergeValidate() {
  const m = mergeInfo(), errs = [], lineErr = {}, isInt = INT_UOMS.includes(m.uom);
  const le = (l, msg) => { lineErr[l.s.inventory_stock_id] = msg; errs.push(`${lotOf(l.s.lot_id).lot_no} / ${lpnNo(l.s.lpn_id)}: ${msg}`); };
  if (m.rows.length < 2) errs.push('합칠 재고를 2건 이상 골라 주십시오.');
  m.lines.forEach(l => {
    const a = avail(l.s);
    if (!(l.qty > 0)) le(l, '넣을 수량을 입력해 주십시오');
    else if (l.qty > a) le(l, `가용 ${q(a)} ${m.uom}까지만 넣을 수 있습니다${l.s.allocated_qty ? ' (할당분 제외)' : ''}`);
    else if (isInt && !Number.isInteger(l.qty)) le(l, `${m.uom}는 정수로만 넣을 수 있습니다`);
  });
  if (!m.lines.length) errs.push('옮겨 올 재고가 없습니다.');
  if (m.target === 'NEW') { const e = capErr(m.loc, 1, emptiedLpns(m.lines)); if (e) errs.push(e); }
  return { ...m, errs, lineErr };
}
function setMergeQty(id, v) { MG.qty[id] = v; refreshMergeSummary(); }
function setTarget(t) { MG.target = t; render(); }

function mergeStepper() {
  const st = MG.done ? 3 : MG.step;
  const steps = [['재고 고르기', '합칠 재고를 2건 이상 고릅니다'], ['합치는 방법', '어디로 모을지 정합니다'], ['확인 및 완료', '결과를 확인하고 실행합니다']];
  return `<div class="stepper">${steps.map((x, i) => {
    const n = i + 1, cls = n < st || (st === 3 && n === 3 && MG.done) ? 'done' : n === st ? 'on' : '';
    return `<div class="step ${cls}"><div class="n">${cls === 'done' ? '✓' : n}</div><div><b>${x[0]}</b><span>${x[1]}</span></div></div>`;
  }).join('')}</div>`;
}
function renderMerge() {
  let h = `<div class="pagehead"><div><h1>재고 통합</h1><p>여러 팔레트에 흩어진 같은 품목 재고를 하나로 모읍니다. 같은 LOT끼리는 LOT 그대로 모이고, 다른 LOT를 합치면 새 LOT가 만들어지며 계보가 남습니다.</p></div>
    ${MG.picked.length ? `<button class="btn" onclick="resetMerge()">처음부터 다시</button>` : ''}</div>`;
  h += mergeStepper();
  if (MG.done) return h + renderMergeDone();
  if (MG.step === 1 || MG.picked.length < 2) return h + renderMergePicker();
  return h + renderMergeEditor();
}

function renderMergePicker() {
  const kw = MG.search.trim().toLowerCase();
  let rows = S.stocks.filter(s => s.on_hand_qty > 0).filter(s => {
    if (!kw) return true;
    const it = ITEMS[s.item_id], lot = s.lot_id ? lotNoOf(s.lot_id) : '', lpn = s.lpn_id ? lpnOf(s.lpn_id).lpn_no : '';
    return [it.code, it.name, lot, lpn, LOCS[s.location_id]].join(' ').toLowerCase().includes(kw);
  });
  const rank = s => MG.picked.includes(s.inventory_stock_id) ? 0 : mergeBlock(s) ? 2 : 1;
  rows = rows.sort((a, b) => rank(a) - rank(b));
  const picked = MG.picked.map(stkOf), n = picked.length;
  const lotCnt = new Set(picked.map(p => p.lot_id)).size, uom = n ? picked[0].uom_code : '';
  const sum = r4(picked.reduce((t, p) => t + avail(p), 0));
  return `<div class="panel">

/* ------------------------------------------------------------------
 * 실행 순서 (통합 설계 "재고변환 실행 순서 · 채번")
 *   ① 기존 행 확인 · 차감 — 재고 행은 inventory_stock_id 오름차순, 실패하면 여기서 ROLLBACK (아직 번호 안 받음)
 *   ② 채번 — 성공이 거의 확실할 때, 채번 행은 규칙 코드 순
 *   ③ 새 행 INSERT → COMMIT (채번 행 잠금 해제)
 * ------------------------------------------------------------------ */
const phase = t => sql(`-- ━━━━━━━━ ${t} ━━━━━━━━`);
/* ① 기존 재고 행 갱신: ops = [{ st, delta, cond }] — ID 오름차순으로 실행, 변경 전 수량을 돌려준다 */
function applyStockOps(ops, ts) {
  const before = {};
  [...ops].sort((a, b) => a.st.inventory_stock_id.localeCompare(b.st.inventory_stock_id)).forEach(op => {
    const st = op.st, b = st.on_hand_qty; before[st.inventory_stock_id] = b;
    st.on_hand_qty = r4(b + op.delta); st.updated_at = ts; mark('inventory_stock', st.inventory_stock_id, 'UPDATE', ['on_hand_qty', 'updated_at']);
    sql(op.delta < 0
      ? `UPDATE inventory_stock SET on_hand_qty = on_hand_qty - ${-op.delta}\n  WHERE inventory_stock_id = '${st.inventory_stock_id}' AND on_hand_qty - allocated_qty >= ${-op.delta}\n  RETURNING on_hand_qty;  -- ${b} → ${st.on_hand_qty} (0건이면 ROLLBACK: 가용 부족)`
      : `UPDATE inventory_stock SET on_hand_qty = on_hand_qty + ${op.delta}\n  WHERE inventory_stock_id = '${st.inventory_stock_id}' RETURNING on_hand_qty;  -- ${b} → ${st.on_hand_qty} (기존 재고 행에 더하기)`, op.note);
  });
  return before;
}
/* ① 기존 LPN 행: guards = 재고를 받는 기존 팔레트(위치 확인, 0건이면 ROLLBACK), others = 재고가 빠지는 팔레트(비면 EMPTY) — LPN ID 순 */
function applyLpnOps(guards, others, ts) {
  const ids = [...new Set([...guards.map(g => g.lpnId), ...others.map(o => o.lpnId)].filter(Boolean))].sort();
  ids.forEach(id => {
    const l = lpnOf(id), g = guards.find(x => x.lpnId === id);
    const want = S.stocks.some(x => x.lpn_id === id && x.on_hand_qty > 0) || (g && g.receives) || others.some(o => o.lpnId === id && o.receives) ? 'ACTIVE' : 'EMPTY';
    if (g) {
      const ch = l.lpn_status !== want; l.lpn_status = want; l.updated_at = ts; mark('lpn', id, 'UPDATE', ch ? ['lpn_status', 'updated_at'] : ['updated_at']);
      sql(`UPDATE lpn SET lpn_status = '${want}', updated_at = now()\n  WHERE lpn_id = '${id}' AND location_id = '${g.loc}' AND lpn_status <> 'CLOSED';  -- ${l.lpn_no} 아직 ${LOCS[g.loc]}에 있는지 확인 (0건이면 ROLLBACK: 팔레트가 이동됨)`, '받는 팔레트 위치 확인');
    } else if (l.lpn_status !== want) {
      l.lpn_status = want; l.updated_at = ts; mark('lpn', id, 'UPDATE', ['lpn_status', 'updated_at']);
      sql(`UPDATE lpn SET lpn_status = '${want}' WHERE lpn_id = '${id}';  -- ${l.lpn_no} ${want === 'EMPTY' ? '재고 0 → 빈 팔레트' : '재고가 다시 담김'}`);
    }
  });
}
function insertStockRow(key, qty, uom, ts, note) {
  const st = { inventory_stock_id: nid('stk'), tenant_id: T, ...key, on_hand_qty: qty, allocated_qty: 0, uom_code: uom, updated_at: ts };
  S.stocks.push(st); mark('inventory_stock', st.inventory_stock_id, 'INSERT');
  sql(`INSERT INTO inventory_stock (item_id, location_id, inventory_status_id, lot_id, lpn_id, owner_id, on_hand_qty, uom_code)\n  VALUES ('${key.item_id}', '${key.location_id}', '${key.inventory_status_id}', '${key.lot_id}', ${key.lpn_id ? `'${key.lpn_id}'` : 'NULL'}, NULL, ${qty}, '${uom}')\n  ON CONFLICT ON CONSTRAINT uq_inventory_stock_01 DO UPDATE SET on_hand_qty = inventory_stock.on_hand_qty + EXCLUDED.on_hand_qty;`, note);
  return st;
}
const litq = x => x ? `'${x}'` : 'NULL';

function executeMerge() {
  const v = mergeValidate(); if (v.errs.length) return;
  const ts = nowStr(), f = v.first, newLot = v.outLot.isNew, newLpn = v.target === 'NEW';
  const lpnIdPlan = v.targetRow ? v.targetRow.lpn_id : null;
  beginTx('재고 통합 실행');

  /* ① 기존 행 확인 · 차감 */
  phase('① 기존 행 확인 · 차감 — 실패하면 여기서 ROLLBACK (아직 번호를 받지 않음)');
  const outKeyExisting = !newLot && !newLpn ? findStock({ item_id: f.item_id, location_id: v.loc, inventory_status_id: f.inventory_status_id, lot_id: f.lot_id, owner_id: f.owner_id, lpn_id: lpnIdPlan }) : null;
  const ops = v.lines.map(l => ({ st: l.s, delta: -l.qty, note: `투입 ${lotOf(l.s.lot_id).lot_no} / ${lpnNo(l.s.lpn_id)}` }));
  if (outKeyExisting) ops.push({ st: outKeyExisting, delta: v.moved, note: `모으는 재고 ${lotNoOf(outKeyExisting.lot_id)} / ${lpnNo(outKeyExisting.lpn_id)}` });
  const before = applyStockOps(ops, ts);
  applyLpnOps(lpnIdPlan && !newLpn ? [{ lpnId: lpnIdPlan, loc: v.loc, receives: true }] : [], v.lines.map(l => ({ lpnId: l.s.lpn_id, receives: false })), ts);

  /* ② 채번 */
  phase('② 채번 — 성공이 거의 확실할 때 (규칙 코드 순)');
  const lotNo = newLot ? takeNo('LOT_MERGE', { itemId: f.item_id, itemCode: ITEMS[f.item_id].code }, ts) : null;
  const lpnNoNew = newLpn ? takeNo('LPN', {}, ts) : null;
  const no = takeNo('TRANSFORM_NO', {}, ts); curTx.title += ' · ' + no;

  /* ③ 새 행 INSERT */
  phase('③ 새 행 INSERT');
  const mergeType = newLot ? 'tt_MERGE' : 'tt_REPACK';   // 결과로 유형 결정 — 같은 LOT끼리 모으면 재구성

      if (!(Number(tol) > 0)) info.err = `기준 수량(${q(std)}) 그대로여야 합니다 — 이 변환 기준 라인은 오차를 허용하지 않습니다`;
      else if (Math.abs(pct) > Number(tol) + 1e-9) info.err = `허용오차 ±${q(tol)}%를 넘었습니다 (${diff > 0 ? '+' : ''}${q(Math.round(pct * 10) / 10)}%)`;
      else if (!TX.reason[key]) info.err = '기준과 다릅니다 — 사유를 골라 주십시오';
    }
    if (info.err) errs.push(`${label}: ${info.err}`);
    lines[key] = info;
  };
  const used = [];
  ins.forEach(l => {
    const it = ITEMS[l.item_id], takes = Object.entries(TX.take[l.transform_input_id] || {}).map(([sid, v]) => ({ s: stkOf(sid), qty: Number(v) || 0 })).filter(t => t.qty !== 0);
    takes.forEach(t => {
      if (t.qty < 0) errs.push(`${it.code}: 수량은 0보다 커야 합니다`);
      else if (t.qty > avail(t.s)) errs.push(`${it.code} ${t.s.lot_id ? lotOf(t.s.lot_id).lot_no : ''}: 가용 ${q(avail(t.s))}까지만 쓸 수 있습니다`);
      else if (INT_UOMS.includes(t.s.uom_code) && !Number.isInteger(t.qty)) errs.push(`${it.code}: ${t.s.uom_code}는 정수로만 쓸 수 있습니다`);
    });
    const act = r4(takes.reduce((t, x) => t + x.qty, 0));
    if (!(act > 0)) errs.push(`${it.code}: 사용할 재고를 골라 주십시오`);
    check(l.transform_input_id, r4(l.quantity * runs), act, l.tolerance_pct, `${it.code} 투입`);
    takes.forEach(t => used.push({ line: l, s: t.s, qty: t.qty }));
  });
  const outPlan = outs.map(o => {
    const it = ITEMS[o.item_id], act = r4(Number(TX.outAct[o.transform_output_id]) || 0);
    if (!(act > 0)) errs.push(`${it.code}: 만들 수량을 입력해 주십시오`);
    else if (INT_UOMS.includes(o.uom_code) && !Number.isInteger(act)) errs.push(`${it.code}: ${o.uom_code}는 정수로만 만들 수 있습니다`);
    check(o.transform_output_id, r4(o.quantity * runs), act, o.tolerance_pct, `${it.code} 산출`);
    let expiry = null;
    if (sp.expiry_rule === 'INHERIT') expiry = minDate(used.filter(u => u.s.lot_id).map(u => lotOf(u.s.lot_id).expiry_date));
    else if (sp.expiry_rule === 'CALC') { if (it.shelf == null) errs.push(`${it.code}: 품목에 유효기간(일)이 없어 유효기한을 계산할 수 없습니다 — 품목에 유효기간(일)을 등록하십시오`); else expiry = addDays(work, it.shelf); }
    return { o, it, act, expiry };
  });
  if (!TX.loc) errs.push('완성된 재고를 둘 위치를 골라 주십시오');
  else { const e = capErr(TX.loc, outs.length, emptiedLpns(used.map(u => ({ s: u.s, qty: u.qty })))); if (e) errs.push(e); }
  return { sp, ins, outs, errs, lines, used, outPlan, work };
}

function txStepper() {
  const st = TX.done ? 3 : TX.specId ? 2 : 1;
  const steps = [['무엇을 만드시겠습니까', '변환 기준을 고릅니다'], ['얼마나 · 어떤 재고로', '수량과 원자재를 확인합니다'], ['확인 및 완료', '결과를 확인하고 실행합니다']];
  return `<div class="stepper">${steps.map((x, i) => {
    const n = i + 1, cls = n < st || (st === 3 && TX.done) ? 'done' : n === st ? 'on' : '';
    return `<div class="step ${cls}"><div class="n">${cls === 'done' ? '✓' : n}</div><div><b>${x[0]}</b><span>${x[1]}</span></div></div>`;
  }).join('')}</div>`;
}
function renderTransform() {
  let h = `<div class="pagehead"><div><h1>품목 변환</h1><p>변환 기준대로 원자재를 써서 다른 품목을 만듭니다. 흩어진 원자재도 먼저 합칠 필요 없이 바로 쓸 수 있습니다.</p></div>

/* 실행 — ① 투입 재고 조건부 차감(ID 순) ② 채번(LOT_TRANSFORM → LPN → TRANSFORM_NO) ③ INSERT */
function executeTransform() {
  const v = txValidate(); if (v.errs.length) return;
  const ts = nowStr(), sp = v.sp;
  beginTx('품목 변환 실행');
  phase('① 기존 행 확인 · 차감 — 실패하면 여기서 ROLLBACK (아직 번호를 받지 않음)');
  const before = applyStockOps(v.used.map(u => ({ st: u.s, delta: -u.qty, note: `투입 ${ITEMS[u.s.item_id].code} ${u.s.lot_id ? lotOf(u.s.lot_id).lot_no : ''}` })), ts);
  applyLpnOps([], v.used.map(u => ({ lpnId: u.s.lpn_id, receives: false })), ts);

  phase('② 채번 — 성공이 거의 확실할 때 (규칙 코드 순)');
  v.outPlan.forEach(p => { p.lotNo = p.it.lot ? takeNo('LOT_TRANSFORM', { itemId: p.o.item_id, itemCode: p.it.code }, ts) : null; });
  v.outPlan.forEach(p => { p.lpnNo = takeNo('LPN', {}, ts); });
  const no = takeNo('TRANSFORM_NO', {}, ts); curTx.title += ' · ' + no;

  phase('③ 새 행 INSERT');
  const exe = { transform_execution_id: nid('exe'), tenant_id: T, transform_no: no, transform_type_id: 'tt_ITEM_TRANSFORM', spec_id: sp.transform_spec_id, spec_multiplier: TX.runs, execution_status: 'COMPLETED', requested_at: ts, requested_by: USER, completed_at: ts, completed_by: USER, updated_at: ts };
  S.execs.push(exe); mark('inventory_transform_execution', exe.transform_execution_id, 'INSERT');
  sql(`INSERT INTO inventory_transform_execution (transform_no, transform_type_id, spec_id, spec_multiplier, execution_status, requested_at, completed_at)\n  VALUES ('${no}', 'tt_ITEM_TRANSFORM', '${sp.transform_spec_id}', ${TX.runs}, 'COMPLETED', now(), now())\n  RETURNING transform_execution_id;  -- ${exe.transform_execution_id} (${sp.spec_code} × ${TX.runs})`, '실행 · 즉시 완료');
  v.used.forEach((u, i) => {
    const ein = { execution_input_id: nid('ein'), transform_execution_id: exe.transform_execution_id, inventory_stock_id: u.s.inventory_stock_id, spec_input_id: u.line.transform_input_id, input_qty: u.qty, uom_code: u.s.uom_code, line_no: i + 1 };
    S.inputs.push(ein); mark('inventory_transform_execution_input', ein.execution_input_id, 'INSERT');
    sql(`INSERT INTO inventory_transform_execution_input (transform_execution_id, inventory_stock_id, spec_input_id, input_qty, uom_code, line_no)\n  VALUES ('${exe.transform_execution_id}', '${u.s.inventory_stock_id}', '${u.line.transform_input_id}', ${u.qty}, '${u.s.uom_code}', ${i + 1});`);
  });
  const addLine = (type, specLineId, item, std, act, uom) => {
    const key = specLineId, ln = { execution_line_id: nid('eln'), transform_execution_id: exe.transform_execution_id, line_type: type, spec_input_id: type === 'IN' ? specLineId : null, spec_output_id: type === 'OUT' ? specLineId : null, item_id: item, standard_qty: std, actual_qty: act, uom_code: uom, diff_reason: act !== std ? TX.reason[key] : null };
    S.execLines.push(ln); mark('inventory_transform_execution_line', ln.execution_line_id, 'INSERT');
    sql(`INSERT INTO inventory_transform_execution_line (transform_execution_id, line_type, ${type === 'IN' ? 'spec_input_id' : 'spec_output_id'}, item_id, standard_qty, actual_qty, uom_code, diff_reason)\n  VALUES ('${exe.transform_execution_id}', '${type}', '${specLineId}', '${item}', ${std}, ${act}, '${uom}', ${ln.diff_reason ? `'${ln.diff_reason}'` : 'NULL'});  -- ${ITEMS[item].code} 기준 ${std} / 실제 ${act}`, type === 'IN' ? '기준 라인 실적 (투입)' : '기준 라인 실적 (산출)');
  };
  v.ins.forEach(l => { const i = v.lines[l.transform_input_id]; addLine('IN', l.transform_input_id, l.item_id, i.std, i.act, l.uom_code); });
  v.outPlan.forEach(p => { const i = v.lines[p.o.transform_output_id]; addLine('OUT', p.o.transform_output_id, p.o.item_id, i.std, i.act, p.o.uom_code); });
  v.used.forEach(u => addHistory(u.s, 'TRANSFORM_OUT', before[u.s.inventory_stock_id], -u.qty, exe.transform_execution_id, ts));

  v.outPlan.forEach((p, idx) => {

      const nl = { lot_id: nid('lot'), tenant_id: T, item_id: p.o.item_id, lot_no: p.lotNo, parent_lot_id: null, last_child_seq: 0, lot_source: 'WMS', supplier_id: null, manufacture_date: v.work, expiry_date: p.expiry, created_at: ts };
      S.lots.push(nl); mark('inventory_lot', nl.lot_id, 'INSERT'); lotId = nl.lot_id;
      sql(`INSERT INTO inventory_lot (item_id, lot_no, parent_lot_id, lot_source, supplier_id, manufacture_date, expiry_date)\n  VALUES ('${p.o.item_id}', '${p.lotNo}', NULL, 'WMS', NULL, '${v.work}', ${p.expiry ? `'${p.expiry}'` : 'NULL'});  -- 제조일 = 작업일, 유효기한 = ${EXPIRY_RULE[sp.expiry_rule]}`, '새 LOT');
    }
    const nlp = { lpn_id: nid('lpn'), tenant_id: T, lpn_no: p.lpnNo, lpn_type: 'PALLET', lpn_source: 'WMS', location_id: TX.loc, lpn_status: 'ACTIVE', updated_at: ts };
    S.lpns.push(nlp); mark('lpn', nlp.lpn_id, 'INSERT'); TX.newLpnIds.push(nlp.lpn_id);
    sql(`INSERT INTO lpn (lpn_no, lpn_type, lpn_source, location_id, lpn_status)\n  VALUES ('${p.lpnNo}', 'PALLET', 'WMS', '${TX.loc}', 'ACTIVE');`, '새 LPN');
    const key = { item_id: p.o.item_id, location_id: TX.loc, inventory_status_id: 'ist_avail', lot_id: lotId, owner_id: null, lpn_id: nlp.lpn_id };
    const st = insertStockRow(key, p.act, p.o.uom_code, ts, '만들어진 재고');
    addHistory(st, 'TRANSFORM_IN', 0, p.act, exe.transform_execution_id, ts);
    const eo = { execution_output_id: nid('eout'), transform_execution_id: exe.transform_execution_id, line_no: idx + 1, inventory_stock_id: st.inventory_stock_id, item_id: p.o.item_id, lot_id: lotId, lot_assign_method: lotId ? 'AUTO' : null, lpn_id: nlp.lpn_id, owner_id: null, location_id: TX.loc, inventory_status_id: 'ist_avail', output_qty: p.act, uom_code: p.o.uom_code, spec_output_id: p.o.transform_output_id };
    S.outputs.push(eo); mark('inventory_transform_execution_output', eo.execution_output_id, 'INSERT');
    sql(`INSERT INTO inventory_transform_execution_output (transform_execution_id, line_no, inventory_stock_id, item_id, lot_id, lot_assign_method, lpn_id, spec_output_id, output_qty)\n  VALUES ('${exe.transform_execution_id}', ${idx + 1}, '${st.inventory_stock_id}', '${p.o.item_id}', ${lotId ? `'${lotId}'` : 'NULL'}, ${lotId ? "'AUTO'" : 'NULL'}, '${nlp.lpn_id}', '${p.o.transform_output_id}', ${p.act});`);
    if (lotId) {
      const byLot = {};
      v.used.filter(u => u.s.lot_id).forEach(u => { byLot[u.s.lot_id] = r4((byLot[u.s.lot_id] || 0) + u.qty); });
      Object.entries(byLot).forEach(([pl, qq]) => {
        const g = { genealogy_id: nid('gen'), tenant_id: T, parent_lot_id: pl, child_lot_id: lotId, transform_execution_id: exe.transform_execution_id, quantity: qq, uom_code: stkOf(v.used.find(u => u.s.lot_id === pl).s.inventory_stock_id).uom_code, created_at: ts };
        S.genealogy.push(g); mark('inventory_lot_genealogy', g.genealogy_id, 'INSERT');
        sql(`INSERT INTO inventory_lot_genealogy (parent_lot_id, child_lot_id, transform_execution_id, quantity, uom_code)\n  VALUES ('${pl}', '${lotId}', '${exe.transform_execution_id}', ${qq}, '${g.uom_code}');  -- ${ITEMS[lotOf(pl).item_id].code} ${lotOf(pl).lot_no} → ${p.it.code} ${p.lotNo}`, '계보 (품목을 넘어감)');
      });
    }
  });
  sql('-- COMMIT → ②에서 잡은 채번 행 잠금이 여기서 풀린다');
  commit();
  closeModal();
  TX.done = exe.transform_execution_id;
  render(); window.scrollTo(0, 0);
  toast('품목 변환이 완료됐습니다.');
}

        ${sp.use_yn === 'Y' ? `<button class="btn primary sm" onclick="pickSpec('${sp.transform_spec_id}')">이 변환 기준으로 만들기</button>` : ''}

function seSet(k, v, rerender) { SE[k] = v; if (rerender) renderSpecModal(); }
function seLine(side, i, k, v, rerender) { SE[side][i][k] = v; if (rerender) renderSpecModal(); }
function seAdd(side) { SE[side].push({ item_id: Object.keys(ITEMS)[0], quantity: 1, tol: 0 }); renderSpecModal(); }

    ${SE.expiry === 'CALC' ? `<div class="note">${SE.outs.map(l => `${ITEMS[l.item_id].code} 유효기간 ${ITEMS[l.item_id].shelf != null ? ITEMS[l.item_id].shelf + '일' : '<b style="color:var(--bad)">미등록 — 품목에 유효기간(일)을 등록해야 실행할 수 있습니다</b>'}`).join(' · ')}</div>` : ''}

const uomOfItem = id => (S.stocks.find(s => s.item_id === id) || { uom_code: 'EA' }).uom_code;
function saveSpec() {
  const err = !SE.code.trim() ? '변환 기준 코드를 입력해 주십시오' : S.specs.some(s => s.spec_code === SE.code.trim() && s.transform_spec_id !== SE.id) ? '이미 있는 변환 기준 코드입니다'
    : !SE.name.trim() ? '변환 기준 이름을 입력해 주십시오'
    : [...SE.ins, ...SE.outs].some(l => !(Number(l.quantity) > 0)) ? '수량은 0보다 커야 합니다'
    : [...SE.ins, ...SE.outs].some(l => !(l.tol !== '' && Number(l.tol) >= 0 && Number(l.tol) <= 100)) ? '허용오차는 0~100% 사이로 입력해 주십시오'
    : SE.ins.some(a => SE.outs.some(b => a.item_id === b.item_id)) ? '같은 품목을 넣는 것과 나오는 것에 함께 둘 수 없습니다'
    : new Set(SE.ins.map(l => l.item_id)).size !== SE.ins.length || new Set(SE.outs.map(l => l.item_id)).size !== SE.outs.length ? '같은 품목이 두 줄에 있습니다. 한 줄로 합쳐 주십시오' : '';
  if (err) { SE.err = err; renderSpecModal(); return; }
  const ts = nowStr(), isNew = !SE.id;
  beginTx(`변환 기준 ${isNew ? '등록' : '수정'} · ${SE.code}`);
  let sp;
  if (isNew) {
    sp = { transform_spec_id: nid('sp'), tenant_id: T, transform_type_id: 'tt_ITEM_TRANSFORM', spec_code: SE.code.trim(), spec_name: SE.name.trim(), priority: 0, expiry_rule: SE.expiry, use_yn: 'Y', updated_at: ts };
    S.specs.push(sp); mark('inventory_transform_spec', sp.transform_spec_id, 'INSERT');
    sql(`INSERT INTO inventory_transform_spec (transform_type_id, spec_code, spec_name, expiry_rule)\n  VALUES ('tt_ITEM_TRANSFORM', '${sp.spec_code}', '${sp.spec_name}', '${sp.expiry_rule}');`);
  } else {
    sp = specOf(SE.id);

function walk(lotId, dir) {
  const gens = genActive(), levels = [], seen = new Set([lotId]);
  let frontier = [lotId];
  for (let depth = 1; frontier.length && depth <= 20; depth++) {
    const edges = [], next = [];
    frontier.forEach(id => gens.filter(g => (dir === 'up' ? g.child_lot_id : g.parent_lot_id) === id).forEach(g => {
      const other = dir === 'up' ? g.parent_lot_id : g.child_lot_id;
      edges.push({ g, from: id, to: other });
      if (!seen.has(other)) { seen.add(other); next.push(other); }
    }));
    if (!edges.length) break;
    levels.push({ depth, nodes: [...new Set(edges.map(e => e.to))], edges });
    frontier = next;

  if (TR.showStock) h += `<div class="panel tr-simple-detail"><div class="tr-detail-head"><div><h2>현재 재고 위치</h2><p>연결된 LOT의 재고가 지금 어디에 얼마나 남아 있는지 확인합니다.</p></div><button class="tr-collapse-btn" onclick="TR.showStock=false;render()">▲ 접기</button></div>

        <div class="tr-stock-field tr-stock-qty"><span class="tr-field-label">현재 수량</span><div class="tr-field-value">${q(s.on_hand_qty)} ${s.uom_code}</div></div>
      </div>`).join('') || '<div class="tr-empty-detail">현재 남아 있는 관련 재고가 없습니다.</div>'}
      </div></div></div>`;

  if (TR.showHistory) h += `<div class="panel tr-simple-detail"><div class="tr-detail-head"><div><h2>LOT 처리 이력</h2><p>이 LOT에 어떤 작업이 있었고 수량과 위치가 어떻게 바뀌었는지 확인합니다.</p></div><button class="tr-collapse-btn" onclick="TR.showHistory=false;render()">▲ 접기</button></div>
      <div class="tr-detail-body"><div class="tr-history-list">${hist.map(x => {
        const ex = x.reference_type === 'INVENTORY_TRANSFORM_EXECUTION' ? execOf(x.reference_id) : null;
        const title = ex ? typeName(ex) : x.transaction_type;
        const dateLabel = ex ? `${title.replace('LOT ', '')}일자` : (x.quantity_delta >= 0 ? '입고일자' : '출고일자');
        let from = '', to = '';
        if (ex) {
          const inLots = [...new Set(S.inputs.filter(i => i.transform_execution_id === ex.transform_execution_id).map(i => (S.stocks.find(s => s.inventory_stock_id === i.inventory_stock_id) || {}).lot_id).filter(Boolean))].map(id => lotOf(id).lot_no);
          const outLots = [...new Set(S.outputs.filter(o => o.transform_execution_id === ex.transform_execution_id).map(o => o.lot_id).filter(Boolean))].map(id => lotOf(id).lot_no);
          from = inLots.join(' + ') || '투입 LOT 없음'; to = outLots.join(' + ') || '결과 LOT 없음';
        } else {
          from = x.quantity_delta >= 0 ? '외부 입고' : lot.lot_no; to = x.quantity_delta >= 0 ? lot.lot_no : '출고';
        }
        return `<div class="tr-history-card">
          <div class="tr-history-card-head"><div class="tr-history-kind">${title}</div><div class="tr-history-date"><b>${dateLabel}</b> · ${x.occurred_at.slice(0,10)}</div></div>

            <div class="tr-history-info">
              <div class="tr-history-info-item qty"><span class="tr-field-label">처리 수량</span><b>${q(Math.abs(x.quantity_delta))} ${x.uom_code}</b></div>
              <div class="tr-history-info-item"><span class="tr-field-label">작업번호</span><b class="mono">${ex ? ex.transform_no : '—'}</b></div>

      }).join('') || '<div class="tr-empty-detail">처리 이력이 없습니다.</div>'}</div></div></div>`;

  h += `<details class="tech" style="margin-top:14px"><summary>조회 쿼리 (개발자용)</summary><pre class="tr-sql">${traceSqlText(TR.lotId)}</pre></details>`;
  return h;
}
function keepFocusTr() { const el = $('#trScan'); if (!el) return; const pos = el.selectionStart; render(); const n = $('#trScan'); n.focus(); n.setSelectionRange(pos, pos); }
function traceSqlText(id) {
  return `-- 이후 LOT (어디로 갔나) — 이전 LOT은 parent / child 를 바꾼다
WITH RECURSIVE down AS (
  SELECT g.child_lot_id AS lot_id, g.parent_lot_id AS from_lot_id, g.transform_execution_id, g.quantity,
         1 AS depth, ARRAY[g.parent_lot_id, g.child_lot_id] AS path
    FROM inventory_lot_genealogy g
    JOIN inventory_transform_execution e ON e.transform_execution_id = g.transform_execution_id
   WHERE g.tenant_id = :tenant AND g.parent_lot_id = '${id}'
     AND e.execution_status <> 'CANCELLED'                 -- 취소된 변환 제외 (옵션)
  UNION ALL
  SELECT g.child_lot_id, g.parent_lot_id, g.transform_execution_id, g.quantity,
         d.depth + 1, d.path || g.child_lot_id
    FROM down d
    JOIN inventory_lot_genealogy g ON g.parent_lot_id = d.lot_id
    JOIN inventory_transform_execution e ON e.transform_execution_id = g.transform_execution_id
   WHERE e.execution_status <> 'CANCELLED'
     AND NOT g.child_lot_id = ANY (d.path)                 -- 순환 방지
     AND d.depth < 20                                      -- 최대 단계
)
SELECT d.*, l.lot_no, l.item_id, x.transform_no, x.transform_type_id
  FROM down d JOIN inventory_lot l ON l.lot_id = d.lot_id
  JOIN inventory_transform_execution x ON x.transform_execution_id = d.transform_execution_id
 ORDER BY d.depth;`.replace(/</g, '&lt;');
}

/* ------------------------------------------------------------------
 * 트랜잭션 — 실행 / 취소
 * ------------------------------------------------------------------ */
let CH = {};           // 마지막 트랜잭션에서 바뀐 행: { table: { pk: 'INSERT' | 'UPDATE', ... } }
let CHCOL = {};        // 바뀐 컬럼: { table: { pk: Set(col) } }
let curTx = null;
function beginTx(title) { CH = {}; CHCOL = {}; curTx = { title, ts: nowStr(), stmts: [] }; }
function sql(text, note) { curTx.stmts.push({ text, note }); }
function mark(table, pk, op, cols) {
  CH[table] = CH[table] || {};
  if (CH[table][pk] !== 'INSERT') CH[table][pk] = op;
  if (cols) { CHCOL[table] = CHCOL[table] || {}; CHCOL[table][pk] = new Set([...(CHCOL[table][pk] || []), ...cols]); }
}
function commit() { S.txlog.unshift(curTx); curTx = null; }
function addHistory(s, type, before, delta, refId, ts) {
  const h = { inventory_history_id: nid('his'), transaction_type: type, item_id: s.item_id, location_id: s.location_id, inventory_status_id: s.inventory_status_id, lot_id: s.lot_id, lpn_id: s.lpn_id, owner_id: s.owner_id, quantity_before: before, quantity_delta: delta, quantity_after: r4(before + delta), uom_code: s.uom_code, reference_type: 'INVENTORY_TRANSFORM_EXECUTION', reference_id: refId, occurred_at: ts };
  S.history.push(h); mark('inventory_history', h.inventory_history_id, 'INSERT');
  sql(`INSERT INTO inventory_history (transaction_type, lot_id, lpn_id, quantity_before, quantity_delta, quantity_after, reference_type, reference_id)\n  VALUES ('${type}', '${s.lot_id}', ${s.lpn_id ? `'${s.lpn_id}'` : 'NULL'}, ${before}, ${delta > 0 ? '+' : ''}${delta}, ${h.quantity_after}, 'INVENTORY_TRANSFORM_EXECUTION', '${refId}');`);
}
function refreshLpnStatus(lpnId, ts) {
  if (!lpnId) return;
  const l = lpnOf(lpnId), has = S.stocks.some(x => x.lpn_id === lpnId && x.on_hand_qty > 0), want = has ? 'ACTIVE' : 'EMPTY';
  if (l.lpn_status !== want) {
    l.lpn_status = want; l.updated_at = ts; mark('lpn', lpnId, 'UPDATE', ['lpn_status', 'updated_at']);
    sql(`UPDATE lpn SET lpn_status = '${want}' WHERE lpn_id = '${lpnId}';  -- ${l.lpn_no} ${want === 'EMPTY' ? '재고가 0이 되어 빈 팔레트' : '다시 재고가 담김'}`);
  }
}

function execute() {
  const v = validate(); if (v.errs.length) return;
  const s = v.s, ts = nowStr(), inLot = lotOf(s.lot_id), root = rootOf(inLot);
  // 조각마다 산출 대상: 새 LOT · 새 LPN이면 새 행, 아니면 기존 행이 있을 수 있음
  const outs = v.P.map(p => {
    const newLot = p.lotMode === 'AUTO', newLpn = p.lpnMode === 'NEW';
    const lotId = p.lotMode === 'KEEP' ? s.lot_id : p.lotMode === 'EXISTING' ? p.lotId : null;
    const lpnId = p.lpnMode === 'KEEP' ? s.lpn_id : p.lpnMode === 'EXISTING' ? p.lpnId : null;
    const existing = !newLot && !newLpn ? findStock({ item_id: s.item_id, location_id: s.location_id, inventory_status_id: s.inventory_status_id, lot_id: lotId, owner_id: s.owner_id, lpn_id: lpnId }) : null;
    return { p, newLot, newLpn, lotId, lpnId, existing };
  });
  beginTx('재고 분할 실행');

  /* ① 기존 행 확인 · 차감 */
  phase('① 기존 행 확인 · 차감 — 실패하면 여기서 ROLLBACK (아직 번호를 받지 않음)');
  const ops = [{ st: s, delta: -v.moved, note: '원 재고에서 새 LOT로 갈 수량만 차감 · 할당분 보호' }];
  outs.filter(o => o.existing).forEach(o => ops.push({ st: o.existing, delta: o.p.qty, note: `${o.p.i + 2}번째 결과 → 기존 재고 행` }));
  const before = applyStockOps(ops, ts);
  const guards = outs.filter(o => o.p.lpnMode === 'EXISTING').map(o => ({ lpnId: o.lpnId, loc: s.location_id, receives: true }));
  applyLpnOps(guards, [{ lpnId: s.lpn_id, receives: outs.some(o => o.p.lpnMode === 'KEEP') }], ts);

  /* ② 채번 */
  phase('② 채번 — 성공이 거의 확실할 때 (최상위 LOT 순번 → 규칙 코드 순)');
  outs.filter(o => o.newLot).forEach(o => {
    root.last_child_seq++; mark('inventory_lot', root.lot_id, 'UPDATE', ['last_child_seq']);
    o.lotNo = formatNo(ruleOf('LOT_SPLIT').pattern, root.last_child_seq, { parent: root.lot_no, itemCode: ITEMS[s.item_id].code }, ts);
    sql(`UPDATE inventory_lot SET last_child_seq = last_child_seq + 1\n  WHERE lot_id = '${root.lot_id}' RETURNING last_child_seq;  -- ${root.last_child_seq} → 규칙 LOT_SPLIT '${ruleOf('LOT_SPLIT').pattern}' → ${o.lotNo}`, '채번 LOT_SPLIT');
  });
  outs.filter(o => o.newLpn).forEach(o => { o.lpnNo = takeNo('LPN', {}, ts); });
  const no = takeNo('TRANSFORM_NO', {}, ts); curTx.title += ' · ' + no;

  /* ③ 새 행 INSERT */
  phase('③ 새 행 INSERT');
  const splitType = outs.some(o => o.p.lotMode !== 'KEEP') ? 'tt_LOT_SPLIT' : 'tt_REPACK';   // 결과로 유형 결정 — LOT가 그대로면 재구성
  const exe = { transform_execution_id: nid('exe'), tenant_id: T, transform_no: no, transform_type_id: splitType, spec_id: null, spec_multiplier: null, execution_status: 'COMPLETED', requested_at: ts, requested_by: USER, completed_at: ts, completed_by: USER, updated_at: ts };
  S.execs.push(exe); mark('inventory_transform_execution', exe.transform_execution_id, 'INSERT');
  sql(`INSERT INTO inventory_transform_execution (transform_no, transform_type_id, spec_id, spec_multiplier, execution_status, requested_at, completed_at)\n  VALUES ('${no}', '${splitType}', NULL, NULL, 'COMPLETED', now(), now())\n  RETURNING transform_execution_id;  -- ${exe.transform_execution_id}`, '실행 · 즉시 완료');
  const ein = { execution_input_id: nid('ein'), transform_execution_id: exe.transform_execution_id, inventory_stock_id: s.inventory_stock_id, spec_input_id: null, input_qty: v.moved, uom_code: s.uom_code, line_no: 1 };
  S.inputs.push(ein); mark('inventory_transform_execution_input', ein.execution_input_id, 'INSERT');
  sql(`INSERT INTO inventory_transform_execution_input (transform_execution_id, inventory_stock_id, input_qty, uom_code, line_no)\n  VALUES ('${exe.transform_execution_id}', '${s.inventory_stock_id}', ${v.moved}, '${s.uom_code}', 1);`, '투입 = 새 LOT로 간 수량 합계');
  addHistory(s, 'TRANSFORM_OUT', before[s.inventory_stock_id], -v.moved, exe.transform_execution_id, ts);
  const newLpnIds = [];
  outs.forEach((o, idx) => {
    const p = o.p;
    let lotId = o.lotId, lpnId = o.lpnId;
    if (o.newLot) {
      const nl = { lot_id: nid('lot'), tenant_id: T, item_id: s.item_id, lot_no: o.lotNo, parent_lot_id: inLot.lot_id, last_child_seq: 0, lot_source: 'WMS', supplier_id: inLot.supplier_id, manufacture_date: inLot.manufacture_date, expiry_date: inLot.expiry_date, created_at: ts };
      S.lots.push(nl); mark('inventory_lot', nl.lot_id, 'INSERT'); lotId = nl.lot_id;
      sql(`INSERT INTO inventory_lot (item_id, lot_no, parent_lot_id, lot_source, supplier_id, manufacture_date, expiry_date)\n  VALUES ('${s.item_id}', '${o.lotNo}', '${inLot.lot_id}', 'WMS', ${litq(nl.supplier_id)}, ${litq(nl.manufacture_date)}, ${litq(nl.expiry_date)});  -- 원 LOT 속성 상속`, '새 LOT');
    }
    if (o.newLpn) {
      const nl = { lpn_id: nid('lpn'), tenant_id: T, lpn_no: o.lpnNo, lpn_type: 'PALLET', lpn_source: 'WMS', location_id: p.loc, lpn_status: 'ACTIVE', updated_at: ts };
      S.lpns.push(nl); mark('lpn', nl.lpn_id, 'INSERT'); lpnId = nl.lpn_id; newLpnIds.push(nl.lpn_id);
      sql(`INSERT INTO lpn (lpn_no, lpn_type, lpn_source, location_id, lpn_status)\n  VALUES ('${o.lpnNo}', 'PALLET', 'WMS', '${p.loc}', 'ACTIVE');  -- ${LOCS[p.loc]}`, '새 LPN');
    }
    const key = { item_id: s.item_id, location_id: p.loc, inventory_status_id: s.inventory_status_id, lot_id: lotId, owner_id: s.owner_id, lpn_id: lpnId };
    const st = o.existing || insertStockRow(key, p.qty, s.uom_code, ts, `${idx + 2}번째 결과 재고`);
    addHistory(st, 'TRANSFORM_IN', o.existing ? before[st.inventory_stock_id] : 0, p.qty, exe.transform_execution_id, ts);
    const eo = { execution_output_id: nid('eout'), transform_execution_id: exe.transform_execution_id, line_no: idx + 1, inventory_stock_id: st.inventory_stock_id, item_id: s.item_id, lot_id: lotId, lot_assign_method: p.lotMode, lpn_id: lpnId, owner_id: s.owner_id, location_id: p.loc, inventory_status_id: s.inventory_status_id, output_qty: p.qty, uom_code: s.uom_code, spec_output_id: null, diff_reason: null };
    S.outputs.push(eo); mark('inventory_transform_execution_output', eo.execution_output_id, 'INSERT');
    sql(`INSERT INTO inventory_transform_execution_output (transform_execution_id, line_no, inventory_stock_id, lot_id, lot_assign_method, lpn_id, output_qty)\n  VALUES ('${exe.transform_execution_id}', ${idx + 1}, '${st.inventory_stock_id}', '${lotId}', '${p.lotMode}', ${litq(lpnId)}, ${p.qty});`);
    if (o.newLot) {
      const g = { genealogy_id: nid('gen'), tenant_id: T, parent_lot_id: inLot.lot_id, child_lot_id: lotId, transform_execution_id: exe.transform_execution_id, quantity: p.qty, uom_code: s.uom_code, created_at: ts };
      S.genealogy.push(g); mark('inventory_lot_genealogy', g.genealogy_id, 'INSERT');
      sql(`INSERT INTO inventory_lot_genealogy (parent_lot_id, child_lot_id, transform_execution_id, quantity, uom_code)\n  VALUES ('${inLot.lot_id}', '${lotId}', '${exe.transform_execution_id}', ${p.qty}, '${s.uom_code}');  -- ${inLot.lot_no} → ${o.lotNo}`, '계보');
    }
  });
  sql('-- COMMIT → ②에서 잡은 채번 행 잠금이 여기서 풀린다');
  commit();

  closeModal();
  SP.done = exe.transform_execution_id;
  SP.newLpnIds = newLpnIds; SP.mixWarn = v.mixWarn;
  render();
  toast(splitType === 'tt_REPACK' ? '팔레트를 나눴습니다 (재구성).' : 'LOT 분할이 완료됐습니다.');
}

function cancelCheck(exe) {
  if (exe.execution_status !== 'COMPLETED') return { ok: false, reasons: ['이미 취소된 실행입니다'] };
  const reasons = [];
  S.outputs.filter(o => o.transform_execution_id === exe.transform_execution_id).forEach(o => {
    const st = stkOf(o.inventory_stock_id);
    const lot = lotNoOf(o.lot_id);
    if (!st || st.on_hand_qty < o.output_qty) reasons.push(`${o.line_no}번 산출 ${lot} / ${lpnNo(o.lpn_id)}: ${LOCS[o.location_id]}에 ${q(o.output_qty)}이 남아 있지 않습니다 (현재 ${q(st ? st.on_hand_qty : 0)} — 이동 · 출고됨)`);
    else if (avail(st) < o.output_qty) reasons.push(`${o.line_no}번 산출 ${lot} / ${lpnNo(o.lpn_id)}: 가용(${q(avail(st))})이 산출(${q(o.output_qty)})보다 적습니다 (현재고 ${q(st.on_hand_qty)}, 할당 ${q(st.allocated_qty)} — 이후 할당 · 분할 등으로 줄어듦)`);
  });
  return { ok: !reasons.length, reasons };
}

function openCancel(exeId) {
  const exe = S.execs.find(e => e.transform_execution_id === exeId), c = cancelCheck(exe);
  if (!c.ok) return;
  const outs = S.outputs.filter(o => o.transform_execution_id === exeId), ins = inputsOf(exeId), kind = typeName(exe);
  $('#modal').innerHTML = `<div class="modal-head"><div><h3>${exe.transform_no} ${kind}을 취소하시겠습니까?</h3><div class="small muted">산출 재고를 빼고 원 재고로 되돌립니다 (TRANSFORM_CANCEL)</div></div><button class="btn sm" onclick="closeModal()">✕</button></div>
  <div class="modal-body">

function doCancel(exeId) {
  const exe = S.execs.find(e => e.transform_execution_id === exeId);
  if (!cancelCheck(exe).ok) return;
  const ts = nowStr();
  beginTx(`${typeName(exe)} 취소 · ${exe.transform_no}`);
  const outs = S.outputs.filter(o => o.transform_execution_id === exeId), ins = inputsOf(exeId);
  /* 기존 행만 바뀐다 — 산출 회수(조건부) · 원 재고 복구를 재고 행 ID 순으로. 채번 없음 */
  phase('① 기존 행 확인 · 갱신 — 산출 재고에 이후 작업이 있으면 0건 → ROLLBACK');
  const ops = [...outs.map(o => ({ st: stkOf(o.inventory_stock_id), delta: -o.output_qty, note: `산출 ${o.line_no} 회수` })), ...ins.map(i => ({ st: stkOf(i.inventory_stock_id), delta: i.input_qty, note: '원 재고 복구' }))];
  const before = applyStockOps(ops, ts);
  exe.execution_status = 'CANCELLED'; exe.updated_at = ts; mark('inventory_transform_execution', exeId, 'UPDATE', ['execution_status', 'updated_at']);
  sql(`UPDATE inventory_transform_execution SET execution_status = 'CANCELLED'\n  WHERE transform_execution_id = '${exeId}' AND execution_status = 'COMPLETED';  -- 0건이면 ROLLBACK (이미 취소됨)`);
  applyLpnOps([], [...outs.map(o => ({ lpnId: o.lpn_id, receives: false })), ...ins.map(i => ({ lpnId: stkOf(i.inventory_stock_id).lpn_id, receives: true }))], ts);
  phase('③ 새 행 INSERT (이력)');
  outs.forEach(o => addHistory(stkOf(o.inventory_stock_id), 'TRANSFORM_CANCEL', before[o.inventory_stock_id], -o.output_qty, exeId, ts));
  ins.forEach(i => addHistory(stkOf(i.inventory_stock_id), 'TRANSFORM_CANCEL', before[i.inventory_stock_id], i.input_qty, exeId, ts));
  sql('-- 새 LOT(inventory_lot) · 계보(inventory_lot_genealogy)는 삭제하지 않음 · 순번 · 일련번호 되돌리지 않음');
  commit();
  closeModal(); render();
  toast(`${exe.transform_no} 취소 완료`);
}

function barcode(text) {
  let x = 0, bars = '';
  const bits = [...text].map(c => c.charCodeAt(0).toString(2).padStart(8, '0')).join('') + '1011';
  for (const b of '11010' + bits) { const w = b === '1' ? 2 : 1; if (b === '1') bars += `<rect x="${x}" y="0" width="${w}" height="42"/>`; x += w + 1; }
  return `<svg viewBox="0 0 ${x} 42" preserveAspectRatio="none">${bars}</svg>`;
}
