.lc .lc-segs{display:flex;flex-direction:column;gap:6px}

/* 로케이션 생성 — 토스형 3단계 (템플릿 → 기본 구조 → 공간 등록) */
.lct{--tb:#3182f6;max-width:760px;margin:0 auto}
.lct .btn{border-radius:11px;padding:10px 15px}.lct .btn.sm{padding:7px 11px}.lct .btn.primary{background:var(--tb);border-color:var(--tb);color:#fff}.lct .btn.primary:hover{background:#1b64da}.lct .btn.ghost{border-color:transparent;background:transparent}
.lct-top{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;margin-top:10px}.lct-top .eyebrow{font-size:12px;font-weight:700;color:var(--tb);margin-bottom:10px}
.lct-top h1{margin:0;font-size:30px;line-height:1.25;letter-spacing:-.035em}.lct-top p{margin:8px 0 0;font-size:15px;line-height:1.7;color:var(--muted);max-width:620px}
.lct-progress{display:flex;height:5px;margin:28px 0 36px;border-radius:999px;background:#edf0f3;overflow:hidden}.lct-progress i{flex:1;transition:background .3s}.lct-progress i.on{background:var(--tb)}
.lct-page.in{animation:lcwNext .22s ease}
.lct-cards{display:flex;flex-direction:column;gap:10px}
.lct-tpl{display:grid;grid-template-columns:48px 1fr auto;column-gap:14px;align-items:center;padding:20px;border:1px solid #e5e8eb;border-radius:16px;background:#fff;text-align:left;cursor:pointer;color:var(--text);transition:.15s}
.lct-tpl:hover{background:#f7fbff;border-color:#90c2ff;transform:translateY(-1px)}.lct-tpl .icon{font-size:30px}.lct-tpl h3{margin:0;font-size:16px}.lct-tpl p{margin:4px 0 0;font-size:13px;line-height:1.5;color:var(--muted)}
.lct-tpl .chain{margin-top:10px;font-size:12px;font-weight:700}.lct-tpl .chain i{margin:0 5px;color:#a1a1aa;font-style:normal}.lct-tpl .go{font-size:22px;color:#b0b8c1}
.lct-panel{margin-top:16px;padding:22px;border-radius:18px;background:#fff;box-shadow:0 0 0 1px #e5e8eb}.lct-panel.soft{background:#fff;box-shadow:0 0 0 1px #e5e8eb}
.lct-title{font-size:15px;font-weight:800}.lct-sub{margin-top:5px;font-size:12px;line-height:1.55;color:var(--muted)}
.lct-levels{display:flex;flex-direction:column;gap:10px;margin-top:14px}.lct-level{display:grid;grid-template-columns:56px 1fr auto auto;gap:7px;align-items:center}.lct-level .depth{font-size:11px;color:var(--muted)}

.lct .lc-link{border:0;border-radius:13px;background:#f5f9ff;color:#4e5968}.lct .lc-strip{display:none}
/* 로케이션 일괄 생성 마법사 — 한 화면에 질문 하나 (토스식) */
.lcw{display:flex;flex-direction:column;min-height:min(620px,86vh)}

.lcw-x{border:0;background:transparent;width:28px;height:28px;border-radius:7px;cursor:pointer;color:var(--muted);font-size:14px}.lcw-x:hover{background:#eef1f6}
.lcw-bar{height:4px;margin-top:10px;border-radius:99px;background:#eef1f6;overflow:hidden}.lcw-bar i{display:block;height:100%;border-radius:99px;background:var(--brand);transition:width .3s}
.lcw-body{flex:1;overflow:auto;padding:28px 24px 18px}.lcw-body.in-next{animation:lcwNext .22s ease}.lcw-body.in-prev{animation:lcwPrev .22s ease}

.lcw-q{margin:0;font-size:23px;font-weight:800;line-height:1.35;letter-spacing:-.02em}.lcw-d{margin:8px 0 22px;font-size:14px;line-height:1.6;color:var(--muted)}.lcw-d b{color:var(--text)}

.lcw-field input::-webkit-inner-spin-button,.lcw-field input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}.lcw-field input{-moz-appearance:textfield}.lcw .lc-preview code{display:block;margin-top:3px}

/* ===== 색상 테마 — 쿨블루 · 화이트 · 쿨그레이 (로케이션 생성 화면 기준) ===== */

/* DB Transaction Viewer — 기본은 접힘, 제목을 누르면 펼침 */
.db-toggle{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;flex:none}.db-toggle:hover h3{color:var(--brand)}

.db.collapsed .db-head{border-bottom:0}.db.collapsed #dbtabs,.db.collapsed #dbnote,.db.collapsed #dbtable{display:none}
.db:not(.collapsed) .db-hint{display:none}
/* ===== 배치도 — 2D 편집 · 3D 보기 ===== */
.lay{--tb:#3182f6}
.lay .btn{border-radius:10px}.lay .btn.primary{background:var(--tb);border-color:var(--tb);color:#fff}
.lay-top{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:16px}.lay-top .eyebrow{font-size:12px;font-weight:700;color:var(--tb);margin-bottom:8px}
.lay-top h1{margin:0;font-size:24px;letter-spacing:-.03em}.lay-top p{margin:6px 0 0;font-size:13px;color:var(--muted);max-width:680px;line-height:1.6}
.lay-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.lay-seg{display:inline-flex;padding:3px;border-radius:10px;background:#eef1f4;gap:2px}.lay-seg button{border:0;background:transparent;padding:6px 10px;border-radius:8px;font:inherit;font-size:12px;font-weight:700;color:#6b7684;cursor:pointer}.lay-seg button.on{background:#fff;color:#191f28;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.lay-body{display:grid;grid-template-columns:118px minmax(0,1fr) 320px;gap:14px;align-items:start}
.lay-tools{display:flex;flex-direction:column;gap:4px;padding:8px;border-radius:14px;background:#fff;box-shadow:0 0 0 1px var(--line);position:sticky;top:76px}
.lay-tools>button{display:flex;align-items:center;gap:8px;padding:9px 8px;border:0;border-radius:9px;background:transparent;font:inherit;font-size:12px;font-weight:650;color:#4e5968;cursor:pointer;text-align:left}
.lay-tools>button i{font-style:normal;width:20px;text-align:center;font-size:15px}.lay-tools>button:hover{background:#f2f4f6}.lay-tools>button.on{background:#e8f3ff;color:#1b64da}.lay-tools>button:disabled{opacity:.4;cursor:not-allowed}
.lay-legend{display:flex;flex-direction:column;gap:5px;margin-top:8px;padding:10px 4px 2px;border-top:1px solid var(--line);font-size:10.5px;color:#6b7684}
.lay-legend span{display:flex;align-items:center;gap:6px}.lay .lay-legend .c,.lay .lay-legend .lg{position:static;box-shadow:inset 0 0 0 1px #d1d6db;display:inline-block;width:12px;height:12px;border-radius:3px;flex:none}
.lay-stage{min-width:0;padding:12px;border-radius:16px;background:#fff;box-shadow:0 0 0 1px var(--line)}
.lay-help{margin-bottom:10px;padding:8px 12px;border-radius:10px;background:#f2f8ff;font-size:12px;color:#4e5968}
.lay-scroll{overflow:auto;max-height:640px;padding:6px}
/* 2D */
.lay-grid{position:relative;touch-action:none;user-select:none;background-color:#f6f7f9;background-image:linear-gradient(#e9ecef 1px,transparent 1px),linear-gradient(90deg,#e9ecef 1px,transparent 1px);background-size:var(--s) var(--s);border-radius:4px}
.lay-grid.tool-rack,.lay-grid.tool-floor,.lay-grid.tool-aisle,.lay-grid.tool-erase{cursor:crosshair}.lay-grid.tool-in,.lay-grid.tool-out{cursor:pointer}.lay-grid.tool-select .lay-rack{cursor:grab}
.lay .c{position:absolute;width:var(--s);height:var(--s);box-sizing:border-box;font-style:normal;font-size:9px;font-weight:800;display:grid;place-items:center;color:#fff;overflow:hidden;white-space:nowrap}
.lay .c.f{background:#fff;box-shadow:inset 0 0 0 .5px #eef0f3}.lay .c.a{background:#fff6d6 repeating-linear-gradient(45deg,transparent 0 4px,rgba(245,180,0,.18) 4px 8px)}
.lay .c.in{background:#16a34a}.lay .c.out{background:#e5484d}
.lay .c.wt{border-top:3px solid #4e5968}.lay .c.wb{border-bottom:3px solid #4e5968}.lay .c.wl{border-left:3px solid #4e5968}.lay .c.wr{border-right:3px solid #4e5968}
.lay .c.in.wt,.lay .c.out.wt{border-top-color:transparent}.lay .c.in.wb,.lay .c.out.wb{border-bottom-color:transparent}.lay .c.in.wl,.lay .c.out.wl{border-left-color:transparent}.lay .c.in.wr,.lay .c.out.wr{border-right-color:transparent}
.lay-ano{position:absolute;z-index:2;transform:translate(-50%,-50%);margin:calc(var(--s)/2) 0 0 calc(var(--s)/2);padding:1px 6px;border-radius:999px;background:#f59f00;color:#fff;font-size:10px;font-weight:800;white-space:nowrap;pointer-events:none}
.lay-rack{position:absolute;z-index:3;box-sizing:border-box;border-radius:3px;background:#dbeafe;border:1px solid #90c2ff;display:grid;place-items:center;overflow:visible}
.lay-rack.h{background-image:repeating-linear-gradient(90deg,transparent 0 calc(var(--s) - 1px),rgba(27,100,218,.35) calc(var(--s) - 1px) var(--s))}
.lay-rack.v{background-image:repeating-linear-gradient(180deg,transparent 0 calc(var(--s) - 1px),rgba(27,100,218,.35) calc(var(--s) - 1px) var(--s))}
.lay-rack.outer{background-color:#d3f9d8;border-color:#69db7c}.lay-rack.double{background-color:#dbeafe}.lay-rack.single{background-color:#e5dbff;border-color:#b197fc}.lay-rack.blocked{background-color:#ffe3e3;border-color:#ff8787}

.lay-rack .face{position:absolute;pointer-events:none}.lay-rack .face.bank{background:var(--tb)}
.lay-rack .face.top{left:0;right:0;top:-1px;height:4px}.lay-rack .face.bottom{left:0;right:0;bottom:-1px;height:4px}.lay-rack .face.left{top:0;bottom:0;left:-1px;width:4px}.lay-rack .face.right{top:0;bottom:0;right:-1px;width:4px}
.lay-prev{position:absolute;z-index:5;box-sizing:border-box;border:2px dashed var(--tb);background:rgba(49,130,246,.12);border-radius:3px;display:grid;place-items:center;font-size:11px;font-weight:800;color:#1b64da;pointer-events:none}
.lay-prev.t-erase{border-color:#e5484d;background:rgba(229,72,77,.1);color:#c92a2a}.lay-prev.t-aisle{border-color:#f59f00;background:rgba(245,159,0,.12);color:#b35c00}.lay-prev.t-floor{border-color:#4e5968;background:rgba(78,89,104,.08);color:#4e5968}
.lg.outer{background:#d3f9d8;border:1px solid #69db7c}.lg.double{background:#dbeafe;border:1px solid #90c2ff}.lg.single{background:#e5dbff;border:1px solid #b197fc}.lg.bank{background:var(--tb)}
/* 3D — CSS transform 으로 단을 쌓는다 */
.lay-3d{height:600px;display:grid;place-items:center;overflow:hidden;perspective:1800px;border-radius:12px;background:linear-gradient(#f7fbff,#eef2f6)}
.lay-3d-floor{position:relative;transform-style:preserve-3d;transform-origin:center}
.lay-3d-floor *{transform-style:preserve-3d}
.lay .c3{position:absolute;width:16px;height:16px;background:#fff;box-shadow:inset 0 0 0 .5px #e5e8eb}.lay .c3.a{background:#ffeea8}.lay .c3.in{background:#16a34a}.lay .c3.out{background:#e5484d}
.lay .w3{position:absolute;background:rgba(78,89,104,.55);border:0}.lay .w3.hz{width:16px;transform-origin:top;transform:rotateX(90deg)}.lay .w3.vt{height:16px;transform-origin:left;transform:rotateY(-90deg)}
.lay .sign3{position:absolute;width:32px;height:14px;transform-origin:top;transform:translateZ(22px) rotateX(90deg);font-style:normal;font-size:9px;font-weight:800;color:#fff;display:grid;place-items:center;border-radius:3px}.lay .sign3.in{background:#16a34a}.lay .sign3.out{background:#e5484d}
.lay .r3{position:absolute;cursor:pointer}

.lay .r3.outer .shelf{background:rgba(64,192,87,.22);border-color:rgba(47,158,68,.6)}.lay .r3.single .shelf{background:rgba(151,117,250,.2);border-color:rgba(112,72,232,.55)}.lay .r3.blocked .shelf{background:rgba(250,82,82,.2);border-color:rgba(224,49,49,.6)}
.lay .side3{position:absolute;background:repeating-linear-gradient(0deg,rgba(27,100,218,.35) 0 1px,transparent 1px var(--lh));border:1px solid rgba(27,100,218,.35)}
.lay .side3.left,.lay .side3.right{background:repeating-linear-gradient(90deg,rgba(27,100,218,.35) 0 1px,transparent 1px var(--lh))}
.lay .side3.bank{background-color:rgba(49,130,246,.16)}
.lay .side3.top{left:0;top:0;transform-origin:top;transform:rotateX(90deg)}.lay .side3.bottom{left:0;top:100%;transform-origin:top;transform:rotateX(90deg)}
.lay .side3.left{left:0;top:0;transform-origin:left;transform:rotateY(-90deg)}.lay .side3.right{left:100%;top:0;transform-origin:left;transform:rotateY(-90deg)}
.lay .tag3{position:absolute;left:2px;top:2px;font-style:normal;font-size:9px;font-weight:800;color:#191f28;background:rgba(255,255,255,.9);padding:0 3px;border-radius:3px}
.lay .r3.sel .shelf{border-color:#191f28}
/* 오른쪽 패널 */
.lay-side{display:flex;flex-direction:column;gap:12px;position:sticky;top:76px}
.lay-card{padding:18px;border-radius:16px;background:#fff;box-shadow:0 0 0 1px var(--line)}
.lay-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.lay .lc-ttl{font-size:20px;margin-top:4px}.lay .lc-k{font-size:11px;color:#8b95a1}.lay .lc-fl{margin:16px 0 8px;font-size:13px}
.lay-kind{display:inline-block;margin-top:10px;padding:4px 10px;border-radius:999px;background:#e5dbff;color:#5f3dc4;font-size:12px;font-weight:800}.lay-kind.outer{background:#d3f9d8;color:#2b8a3e}.lay-kind.double{background:#dbeafe;color:#1b64da}.lay-kind.blocked{background:#ffe3e3;color:#c92a2a}
.lay-fields{display:flex;flex-direction:column;gap:10px;margin-top:14px}

.lay-step{display:inline-flex;align-items:center;gap:4px}.lay-step button{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:16px;cursor:pointer}.lay-step b{min-width:30px;text-align:center;font-size:15px}
.lay-face{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;margin-top:6px;border-radius:12px;background:#f9fafb;cursor:pointer}.lay-face b{display:block;font-size:13px}.lay-face span{display:block;font-size:11px;color:#6b7684;margin-top:2px}

// 실제 서비스는 decimal 라이브러리(Java 는 BigDecimal)를 쓴다. 여기서는 BigInt 로 흉내낸다.
function decParse(x){ const s = String(x).trim(); const neg = s.startsWith('-'); const [i, f = ''] = s.replace('-', '').split('.'); return { n:BigInt((neg ? '-' : '') + (i || '0') + f), s:f.length }; }
function decStr(n, s){ const neg = n < 0n; let t = (neg ? -n : n).toString().padStart(s + 1, '0'); let out = s ? t.slice(0, -s) + '.' + t.slice(-s) : t; if (s) out = out.replace(/\.?0+$/, ''); return (neg && out !== '0' ? '-' : '') + out; }
function decMul(a, b){ const x = decParse(a), y = decParse(b); return decStr(x.n * y.n, x.s + y.s); }
function decAdd(a, b){ const x = decParse(a), y = decParse(b); const s = Math.max(x.s, y.s); return decStr(x.n * 10n ** BigInt(s - x.s) + y.n * 10n ** BigInt(s - y.s), s); }
const decSub = (a, b) => decAdd(a, String(b).startsWith('-') ? String(b).slice(1) : '-' + b);
const decCmp = (a, b) => { const d = decParse(decSub(a, b)).n; return d > 0n ? 1 : d < 0n ? -1 : 0; };
const decPlaces = (x) => { const f = String(x).split('.')[1]; return f ? f.replace(/0+$/, '').length : 0; };
const N = (x) => Number(x);   // 표시·비교용

/** 입력 수량을 기준 단위로 환산. 규칙 위반이면 { error } */
function toBase(itemId, uom, qtyStr){
  const q = String(qtyStr ?? '').trim();
  if (!/^\d+(\.\d+)?$/.test(q) || decCmp(q, '0') <= 0) return { error:'수량을 0보다 크게 입력하세요.' };
  const u = uomOf(uom), base = baseUomOf(itemId), bu = uomOf(base), conv = convOf(itemId, uom);
  if (!conv) return { error:`${itemId} 에는 ${uom} 단위가 없습니다 (item_uom).` };
  if (decPlaces(q) > u.decimal_places) return { error:`${uom} 단위는 소수 ${u.decimal_places}자리까지만 입력할 수 있습니다.` };
  const b = decMul(q, conv);
  if (decPlaces(b) > bu.decimal_places) return { error:`${q} ${uom} 는 기준 단위로 ${b} ${base} 라 소수 ${bu.decimal_places}자리를 넘습니다. 기준 단위(${base})로 입력하거나 품목 단위 설정을 확인하세요.` };
  return { base:b, conv };
}

  const steps = [{ step:'창고 하위', remain:rows.length }];
  rows.forEach((r) => { const why = hardRuleReason(r.loc, ctx, r.occ); if (why) { r.out = why; r.stage = '하드 규칙'; } });
  steps.push({ step:'하드 규칙', remain:alive().length });
  filtersOf(sid).filter((f) => f.enabled_yn === 'Y').forEach((f) => {
    alive().forEach((r) => { const why = filterReason(f.filter_type, r.loc, ctx, r.occ, st); if (why) { r.out = why; r.stage = filterLabel(f.filter_type); } });
    steps.push({ step:filterLabel(f.filter_type), code:f.filter_type, remain:alive().length });
  });
  const pr = prioritiesOf(sid), ranked = alive();
  ranked.forEach((r) => { r.keys = pr.map((p) => priorityKey(p.criterion_code, r.loc, ctx, r.occ)); });
  // 모든 기준이 동률이면 putaway_seq → location_code (같은 입력이면 항상 같은 결과)
  ranked.sort((a, b) => { for (let i = 0; i < pr.length; i++) { const d = cmpKey(a.keys[i][0], b.keys[i][0]); if (d) return d; } return cmpKey(a.loc.putaway_seq ?? Infinity, b.loc.putaway_seq ?? Infinity) || a.loc.location_code.localeCompare(b.loc.location_code); });
  return { strategy:st, rows, steps, ranked, priorities:pr.map((p) => p.criterion_code), selected:ranked[0]?.loc || null };
}
function ctxValue(type, ctx){
  const it = itemOf(ctx.item_id);
  const v = { INBOUND_TYPE:ctx.inbound_type, INBOUND_CATEGORY:ctx.inbound_category, ITEM:it.item_code, ITEM_LARGE_CATEGORY:it.large_category_code, ITEM_MIDDLE_CATEGORY:it.middle_category_code,
    INVENTORY_STATUS:ctx.status, STORAGE_ENV:it.storage_env_code || 'AMBIENT', UOM:ctx.uom_code, PARTNER:ctx.partner_id, EXTERNAL_SITE_CODE:ctx.site, EXTERNAL_STORAGE_CODE:ctx.sloc }[type];
  return v === undefined || v === '' ? null : v;
}
/** 조건 행끼리 AND, 값 목록은 OR. 비교 대상 NULL → IN 불일치 / NOT_IN 일치 */
function ruleMatch(rule, ctx){
  const hits = [];
  for (const c of conditionsOf(rule.rule_id)) {
    const v = ctxValue(c.condition_type, ctx), inList = v !== null && c.condition_values.includes(v), label = condLabel(c.condition_type), vals = c.condition_values.join(', ');
    if (c.operator === 'IN' ? !inList : inList) return { ok:false, why:`${label} ${v ?? 'NULL'} ${c.operator === 'IN' ? '∉' : '∈'} [${vals}]`,
      say:c.operator === 'IN' ? (v === null ? `${label} 값이 없어 조건(${label} ${vals})에 해당하지 않습니다` : `이 입고 건은 ${label} <b>${v}</b> 라 조건(${label} ${vals})에 해당하지 않습니다`) : `${label} <b>${v}</b> 은(는) 이 규칙의 제외 대상입니다` };
    hits.push(c.operator === 'IN' ? `${label} <b>${v}</b>` : `${label} ${v ?? '없음'}(제외 대상 아님)`);
  }
  return { ok:true, why:hits.length ? '조건 일치' : '조건 없음 (기본 규칙)', say:hits.length ? `이 입고 건은 ${hits.join(', ')} 라 조건과 일치합니다` : '조건이 없는 기본 규칙이라 모든 입고 건에 적용됩니다' };
}
/** 엔진: 규칙을 rule_priority 순으로 매칭 → 전략 실행 → 후보 없으면 fallback (NEXT_RULE 는 다음 매칭 규칙으로, 이미 실행한 전략은 건너뜀) */
function runEngine(ctx){
  const trail = [], done = new Set();
  for (const r of db.putaway_strategy_rule.filter((x) => x.use_yn === 'Y').sort((a, b) => a.rule_priority - b.rule_priority)) {
    const st = strategyOf(r.putaway_strategy_id);
    if (st.use_yn !== 'Y') { trail.push({ rule:r, strategy:st, result:'SKIPPED', note:'전략 미사용' }); continue; }
    const m = ruleMatch(r, ctx);
    if (!m.ok) { trail.push({ rule:r, strategy:st, result:'NOT_MATCHED', note:m.why, say:m.say }); continue; }
    if (done.has(st.putaway_strategy_id)) { trail.push({ rule:r, strategy:st, result:'SKIPPED', note:'이미 실행한 전략' }); continue; }
    done.add(st.putaway_strategy_id);
    const ev = evaluateStrategy(st, ctx);
    if (ev.selected) { trail.push({ rule:r, strategy:st, result:'SELECTED', note:m.why, say:m.say, eval:ev }); return { outcome:'SELECTED', rule:r, strategy:st, eval:ev, trail }; }
    trail.push({ rule:r, strategy:st, result:'NO_CANDIDATE', note:`후보 없음 → ${st.fallback_policy}`, say:m.say, fallback:st.fallback_policy, eval:ev });
    if (st.fallback_policy === 'MANUAL') return { outcome:'MANUAL', reason:`${st.strategy_code} 후보 없음 → fallback MANUAL`, trail };
  }
  return { outcome:'MANUAL', reason:trail.some((t) => t.eval) ? 'NEXT_RULE 로 넘길 다음 규칙 없음 → MANUAL' : '매칭되는 적용조건 없음 → MANUAL', trail };
}
/** 입하장 재고 → 엔진 입력 (입고 문맥은 재고를 만든 receipt → detail → header) */
function ctxFromStock(s, baseQty){
  const r = receiptOfStock(s), d = r && detail(r.inbound_detail_id), h = r && header(r.inbound_id);
  return { item_id:s.item_id, lot_id:s.lot_id, lpn_id:s.lpn_id || null, status:s.inventory_status_id, base_qty:baseQty, uom_code:r ? r.uom_code : s.uom_code,
    inbound_type:h?.inbound_type ?? null, inbound_category:h?.inbound_category ?? null, partner_id:h?.partner_id ?? null, site:d?.external_site_code ?? null, sloc:d?.external_storage_code ?? null };
}
/** putaway_instruction.strategy_trace — 판단 당시 근거 스냅샷 (단계별 남은 개수 + 상위 5개) */
function buildTrace(res, ctx){
  const last = [...res.trail].reverse().find((t) => t.eval)?.eval;
  return { evaluated_at:now(), context:{ item_code:ctx.item_id, lot_no:lotNoOf(ctx.lot_id), lpn:ctx.lpn_id ? (lpnNo(ctx.lpn_id) || '새 LPN') : null, inventory_status:ctx.status, base_qty:ctx.base_qty, sloc:ctx.sloc },
    rules:res.trail.map((t) => ({ rule_priority:t.rule.rule_priority, strategy_code:t.strategy?.strategy_code, result:t.result, ...(t.fallback ? { fallback:t.fallback } : {}) })),
    counts:last ? Object.fromEntries(last.steps.map((s) => [s.code || s.step, s.remain])) : {},
    priorities:last ? last.priorities : [],
    top_candidates:last ? last.ranked.slice(0, 5).map((r) => ({ location_code:r.loc.location_code, keys:r.keys.map((k) => k[1]) })) : [],
    selected:res.outcome === 'SELECTED' ? res.eval.selected.location_code : null, outcome:res.outcome };
}

function lcPresetEditor(n){

function lcApplyPlan(p){ if (!p.length) return; nodeOf(LC.cSel).child_plan = [...p]; lcResetAdd(); dbCurrent = 'space_node'; render(); }
function lcResetPlan(){ const n = nodeOf(LC.cSel), p = lcNode(n.parent_node_id); n.child_plan = p ? p.child_plan.slice(1) : SPACE_TEMPLATE.levels.slice(1); lcResetAdd(); render(); }
function lcSetNode(f, v){ const n = nodeOf(LC.cSel); if (f === 'node_role') n.node_role = n.node_role === v ? null : v; else n[f] = v; dbCurrent = 'space_node'; render(); }

function lcNewLoc(code, nid, type, usage, coords){
  // 생성 시점에는 적치 조건 · 정책을 넣지 않는다 = 제한 없음
  return { location_id:'loc_' + code, node_id:nid, location_code:code, location_type:type, location_usage:usage, is_active:true, level_no:coords?.L ?? null, storage_env_code:null, lock_status:'NORMAL', max_weight:null, capacity_qty:null, capacity_uom:null, putaway_seq:null, storage_policy_id:null };

function lcPushNode(parent, nid, name, level, extra){

}
/** 공간 하나 등록. 실패하면 toast 후 null. 화면 이동은 부르는 쪽이 정한다 */
function lcAddNode(){
  const parent = lcNode(LC.cSel), plan = lcPlan(parent), level = plan[0], a = LC.add, name = (a.name || '').trim();
  if (!level) return null;
  if (!name) { toast('이름을 입력해 주세요.'); return null; }
  if (lcKids(LC.cSel).some((k) => k.node_name === name)) { toast('같은 위치에 동일한 이름이 이미 있습니다.'); return null; }
  const asLoc = plan.length === 1 && a.asLoc;
  if (asLoc && (locRows.some((l) => l.location_code === name) || nodeOf('n_' + name))) { toast(`이미 사용 중인 로케이션 코드입니다: ${name}`); return null; }
  const nid = asLoc ? 'n_' + name : id('sn');
  const node = lcPushNode(parent, nid, name, level, asLoc ? {} : { node_role:a.role, node_kind:a.role === 'WAREHOUSE' ? a.kind : 'NORMAL', child_plan:plan.slice(1) });
  if (asLoc) locRows.push(lcNewLoc(name, nid, a.type, a.usage));
  dbCurrent = asLoc ? 'location' : 'space_node';
  toast(asLoc ? `로케이션 ${name} 등록 · 적치 조건 없음(제한 없음)` : `${level} ${name} 등록`);
  return { node, asLoc, level, name };
}
function lcSubmitAdd(){

function lctPlanChoices(n){
  const def = lctDefPlan(n), leaf = def[def.length - 1] || '로케이션', mid = def.length > 1 ? def[0] : 'ZONE', seen = new Set(), out = [];
  [[def, '기본 구조 그대로', '템플릿에서 정한 구조예요'], [[leaf], `바로 ${leaf}`, '중간 구분 없이 바로 관리해요'], ...(def.length > 1 ? [[[mid, 'RACK', leaf], `${mid} › RACK › ${leaf}`, '랙 구조까지 세분화해요'], [['ZONE', 'CELL'], 'ZONE › CELL', '자동창고 셀 구조예요']] : [[['RACK', leaf], `RACK › ${leaf}`, '랙 단위로 한 단계 더 나눠요']])]

function lcBanks(aisles){

}

/** 트리 보기 — 필터에 맞는 로케이션과 그 상위만 남긴다 */
function lcTreeRows(){

  const keep = {};

    const l = lcLocByNode(n.node_id);
    let ok = l ? locSet.has(l.location_id) : (!filt || (q && n.node_name.toLowerCase().includes(q) && !LC.f.type && !LC.f.usage && !LC.f.policy && !LC.f.status && !LC.f.wh));
    lcKids(n.node_id).forEach((k) => { if (visit(k)) ok = true; });
    keep[n.node_id] = ok; return ok;
  };
  lcKids(null).forEach(visit);
  let h = '', count = 0;
  const walk = (pid, dep) => lcKids(pid).forEach((n) => {
    if (!keep[n.node_id]) return;
    const l = lcLocByNode(n.node_id), kids = lcKids(n.node_id).filter((k) => keep[k.node_id]), deeper = lv.depth && dep + 1 >= lv.depth;
    const open = kids.length && !deeper && (filt || !lv.closed[n.node_id]);
    const tog = kids.length && !deeper ? `<button class="lc-tog" onclick="event.stopPropagation();LC.lv.closed['${n.node_id}']=!LC.lv.closed['${n.node_id}'];lcListBody()">${open ? '▾' : '▸'}</button>` : '<span class="lc-tog sp"></span>';
    const name = l ? `<b class="code">${lcEsc(l.location_code)}</b>` : `<b>${n.node_name === LC_TENANT ? '🏢 ' : ''}${lcEsc(n.node_name)}</b>${kids.length && (deeper || !open) ? ` <span class="path">· 하위 ${kids.length}</span>` : ''}`;
    h += `<tr class="lc-tr ${l ? 'loc' : 'node d' + Math.min(dep, 4)} ${LC.lSel === n.node_id ? 'sel' : ''}" onclick="LC.lSel='${n.node_id}';lcListBody()"><td><div class="lc-tname" style="padding-left:${dep * 16}px">${tog}${name}${lcNameChips(n, l)}</div></td>${l ? lcLocRowCells(l) : lcNodeRowCells(n, lcNodeStat(n.node_id, filt ? locSet : null))}</tr>`;
    count++;
    if (open) walk(n.node_id, dep + 1);

  walk(null, 0);
  return { html:h, count, locs:locSet.size };
}

/* =====================================================================
 * 4. 배치도 — 창고 윤곽 · 입구/출구 · 통로 · 랙을 놓고 단 수를 넣으면 셀(로케이션)을 만든다

 * ===================================================================== */
const LAY_TOOLS = [['select','↖','선택 · 이동'],['floor','▢','바닥 (윤곽)'],['aisle','▤','통로'],['rack','▥','랙'],['in','⇥','입구'],['out','⇤','출구'],['erase','⌫','지우개']];

const LAY_NOTE = '배치도 객체(화면용 · 저장 설계 전). OUTLINE = 바닥 칸 수, DOOR_IN · DOOR_OUT = 입구 · 출구, AISLE = 통로 칸 수, RACK = 랙(열 · 단 · 깊이 · 판별 결과). 셀 생성 시 location 에 layout_x · layout_y 를 남긴다.';

LC.layouts = {};
LC.lay = null;
const layKey = (x, y) => x + ',' + y;
const layL = () => LC.layouts[LC.lay.nid];

function layBlank(cols, rows){

  return L;
}
/** 기본: 바닥(윤곽) · 아래쪽 주통로 · 입구 · 출구 */

  for (let x = 0; x < 36; x++) for (const y of [19, 20]) L.cells[layKey(x, y)] = 'A';
  L.cells[layKey(3, 21)] = 'I'; L.cells[layKey(32, 21)] = 'O';

/** 예시: 벽 쪽 외측 랙 · 양면 랙 · 가로 통로 · 오른쪽 벽 세로 랙 */

  const rack = (x, y, w, h, levels) => L.racks.push({ id:'R' + (++L.seq), x, y, w, h, levels, flip:false, off:{} });

/* ---------- 판별 ---------- */
const layHoriz = (r) => r.w >= r.h;
function layOcc(L){ const m = {}; L.racks.forEach((r) => { for (let y = r.y; y < r.y + r.h; y++) for (let x = r.x; x < r.x + r.w; x++) m[layKey(x, y)] = r.id; }); return m; }
/** 랙의 한 면 바로 바깥 칸들 */
function laySideCells(r, side){
  const out = [];

  else { const x = side === 'left' ? r.x - 1 : r.x + r.w; for (let y = r.y; y < r.y + r.h; y++) out.push([x, y]); }
  return out;
}

/* ---------- 배치도 그리기 메뉴 — 만들어진 공간 중에서 골라 배치도를 만들거나 고친다 ---------- */

/** DB Viewer 용 — 배치도 객체 행 */
function layRows(){
  const rows = [];
  Object.entries(LC.layouts).forEach(([nid, L]) => {
    const vals = Object.values(L.cells), an = layAnalyze(L);
    rows.push({ layout_object_id:`lo_${nid}_outline`, node_id:nid, object_type:'OUTLINE', x:0, y:0, w:L.cols, h:L.rows, levels:null, detail:`바닥 ${vals.length}칸` });
    rows.push({ layout_object_id:`lo_${nid}_aisle`, node_id:nid, object_type:'AISLE', x:null, y:null, w:null, h:null, levels:null, detail:`통로 ${vals.filter((c) => c === 'A').length}칸 · 통로 번호 ${an.aisles.length}개` });
    Object.entries(L.cells).forEach(([k, c]) => { if (c === 'I' || c === 'O') { const [x, y] = k.split(',').map(Number); rows.push({ layout_object_id:`lo_${nid}_${k}`, node_id:nid, object_type:c === 'I' ? 'DOOR_IN' : 'DOOR_OUT', x, y, w:1, h:1, levels:null, detail:null }); } });
    an.racks.forEach(({ r, kind, banks }) => rows.push({ layout_object_id:`lo_${nid}_${r.id}`, node_id:nid, object_type:'RACK', x:r.x, y:r.y, w:r.w, h:r.h, levels:r.levels, detail:`${kind} · BANK ${banks.map((b) => lcPad(b.no)).join(',') || '-'}` }));
  });
  return rows;
}

    putaway_strategy_rule_condition:'적용조건 행. 항목별 1행, IN / NOT_IN, 값 목록(text[]). 행끼리 AND, 값끼리 OR.',
    lpn:'LPN(팔레트·박스·토트). LPN 하나 = 위치 하나, 혼합 팔레트 허용, lpn_no 테넌트 내 유일(uq_lpn_01). 재고 유일키에 lpn_id 포함. lpn_source = EXTERNAL(라벨 스캔) / WMS(채번), lpn_status = ACTIVE / EMPTY / CLOSED.',
    if_transaction_log:'인터페이스 수신 원본 로그. 엑셀 업로드는 source_channel = EXCEL_UPLOAD, 일부 문서가 오류로 제외되면 process_status = PARTIAL.',
    item_fixed_location:'품목별 지정 위치. 우선 사용(전용 아님) — FIXED_LOCATION 정렬 · FIXED_ONLY 필터가 참조.',
  };
  $('dbnote').innerHTML = `<b>${dbCurrent}</b> · ${notes[dbCurrent] || LAY_NOTE}`;
  const rows = tables[dbCurrent];
  if (!rows.length) { $('dbtable').innerHTML = '<div class="empty">아직 데이터가 없습니다. 위 업무 화면에서 작업을 실행하면 여기에 행이 생성됩니다.</div>'; return; }
  const cols = [...new Set(rows.flatMap(Object.keys))];
  $('dbtable').innerHTML = `<table><thead><tr>${cols.map((c) => `<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.map((r) => `<tr>${cols.map((c) => `<td>${r[c] === null || r[c] === undefined ? '<span style="color:#a0a8b5">NULL</span>' : r[c]}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}
